code,.mono{font-family:'JetBrains Mono',monospace}
a{color:inherit;text-decoration:none}

.brand{font-weight:800;font-size:1.3em}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab-btn{padding:9px 18px;border-radius:999px;border:1px solid var(--bd);background:var(--sf);font-family:'DM Sans';font-weight:700;font-size:.92em;cursor:pointer;color:var(--tx)}
.tab-btn.active{background:var(--tx);color:#fff;border-color:var(--tx)}

.pg{display:none;max-width:1200px;margin:0 auto;padding:32px 24px 80px}
.pg.active{display:block}

/* --- home --- */
.hero{text-align:center;padding:50px 20px 30px}
.hero h1{font-size:2.4em;background:linear-gradient(90deg,#1a1e27,#4f46e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:560px;margin:14px auto 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:30px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border-top:4px solid var(--ac,#000);cursor:pointer;transition:transform .15s}

.card .icon{font-size:1.8em}
.card h3{margin-top:8px;font-size:1.05em}
.card .sub{color:var(--mut);font-size:.85em;margin-top:4px}
.card .units{margin-top:10px;font-size:.78em;color:var(--mut)}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{padding:8px 16px;border-radius:999px;border:2px solid var(--bd);background:var(--sf);font-weight:700;font-size:.88em;cursor:pointer}
.chip.active{background:var(--ac,#000);border-color:var(--ac,#000);color:#fff}
.unit-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.unit-nav button{padding:7px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);cursor:pointer;font-size:.85em;font-weight:600}
.unit-nav button.active{background:var(--ac,#000);color:#fff;border-color:var(--ac,#000)}
.sg-content h2{font-size:1.5em;margin-bottom:6px;color:var(--ac,#000)}
.sg-content h3{font-size:1.15em;margin-top:1.4em;margin-bottom:.4em}
.sg-content p{margin:.7em 0}
.sg-content ul,.sg-content ol{margin:.6em 0 .6em 1.4em}
.sg-content table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.92em}
.sg-content th,.sg-content td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}
.sg-content th{background:#eef2ff}
.sg-content code{background:#eee;padding:2px 5px;border-radius:4px}
.sg-box{border-radius:8px;padding:14px 16px;margin:1em 0;border-left:5px solid #999}
.sg-box.def{background:#eef2ff;border-color:#4f46e5}
.sg-box.warn{background:#fef3c7;border-color:#d97706}
.sg-box.tip{background:#d1fae5;border-color:#059669}
.sg-box.ex{background:#f1f5f9;border-color:#64748b}
.sg-box b:first-child{display:block;margin-bottom:4px}

.quiz-box{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:26px;max-width:720px;margin:0 auto;box-shadow:var(--shadow)}
.qtext{font-weight:700;font-size:1.15em;margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:10px;border:2px solid var(--bd);border-radius:10px;background:var(--sf);cursor:pointer;font-family:'DM Sans';font-size:.98em}

.opt.correct{background:#d1fae5;border-color:#059669}
.opt.wrong{background:#fee2e2;border-color:#dc2626}

.progress-bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:20px}
.progress-fill{height:100%;background:var(--ac,#4f46e5);transition:width .3s}
.qmeta{display:flex;justify-content:space-between;color:var(--mut);font-size:.85em;margin-bottom:10px}

'13.1': `
<h2>13.1 User-Defined Data Types</h2>
<p>Languages give you primitive types (INTEGER, REAL, CHAR, STRING, BOOLEAN). A <b>user-defined data type (UDT)</b> is built by the programmer from existing types, and splits into two families:</p>
<table><tr><th>Non-composite</th><th>Composite</th></tr>
<tr><td>Defined <i>without</i> referencing another type — enumerated, pointer</td><td>Definition <i>refers to</i> other types — record, set, class</td></tr></table>

<h3>Enumerated data type</h3>
<p>A list of all possible values in an <b>implied order</b>. Values are identifiers, not strings — no quotation marks.</p>
<div class="sg-box ex"><code>TYPE Tmonth = (January, February, ..., December)<br>DECLARE thisMonth : Tmonth<br>thisMonth &lt;- January<br>nextMonth &lt;- thisMonth + 1  // now February</code></div>
<div class="sg-box tip">Because values have an implied order, you can do <code>+1</code> to move to the next value and compare them (January &lt; March is true).</div>

<h3>Pointer data type</h3>
<p>Stores the <b>memory address</b> of data, not the data itself. <code>^</code> before a type means "pointer to"; <code>^</code> after a variable <b>dereferences</b> it (follows the address to get the value).</p>
<div class="sg-box ex"><code>TYPE TmonthPointer = ^Tmonth<br>monthPointer &lt;- ^thisMonth   // address of thisMonth<br>myMonth &lt;- monthPointer^      // dereference: get the value</code></div>

<h3>Record, Set, Class (composite)</h3>
<ul>
<li><b>Record</b> — groups several fields, each with its own type, under one type name.</li>
<li><b>Set</b> — an <b>unordered</b> list of elements supporting <b>union</b> and <b>intersection</b>.</li>
<li><b>Class</b> — bundles variables and methods; an <b>object</b> is created from a class.</li>
</ul>
<table><tr><th>Situation</th><th>Sensible type</th></tr>
<tr><td>A fixed set of colours to choose from</td><td>Enumerated</td></tr>
<tr><td>Data about each house an estate agent sells</td><td>Record</td></tr>
<tr><td>Addresses of integers held in memory</td><td>Pointer</td></tr>
<tr><td>The vowels of the alphabet</td><td>Set</td></tr></table>
`,
'13.2': `
<h2>13.2 File Organisation and Access</h2>
<p><b>File organisation</b> = how records are physically arranged. <b>File access</b> = how a record is physically found.</p>
<table><tr><th>Organisation</th><th>How stored</th><th>Typical use</th></tr>
<tr><td><b>Serial</b></td><td>Order added (chronological), appended to the end</td><td>Transaction files, e.g. meter readings</td></tr>
<tr><td><b>Sequential</b></td><td>Sorted by key field, inserted in the correct place</td><td>Master files, e.g. customers by account number</td></tr>
<tr><td><b>Random</b></td><td>Any available position, decided by a hashing algorithm</td><td>Fast direct access to individual records</td></tr></table>
<div class="sg-box warn">Serial vs sequential is a favourite exam question: both are one-after-another, but serial = order added (unsorted), sequential = sorted by key field.</div>

<h3>Access methods</h3>
<p><b>Sequential access</b> — records checked one after another from the start. For a sequential file, you can stop early once the key exceeds the target. Efficient when almost every record is processed (high hit rate).</p>
<p><b>Direct access</b> — finds a record without reading the others. Best for a single record (low hit rate). A sequential file uses an <b>index</b> of key fields → address; a random file uses a <b>hashing algorithm</b> to calculate the address directly.</p>

<h3>Hashing algorithms</h3>
<p>A mathematical formula on the <b>key field</b> that calculates a record's storage address.</p>
<div class="sg-box ex"><b>Worked example:</b> 2000 records, key 1–9999, hash = key MOD 2000. Key 3024 → 3024 MOD 2000 = 1024 → stored at address 1024.</div>
<p><b>Collision:</b> key 5024 also hashes to 1024 (5024 MOD 2000 = 1024) — two keys want the same location.</p>
<table><tr><th>Open hash</th><th>Closed hash</th></tr>
<tr><td>Store in the next free space in the main file</td><td>Store in the next free space in a separate overflow area</td></tr></table>
<div class="sg-box tip">Hashing can also work on names — e.g. sum the ASCII values of the characters, divide by the number of locations, use the remainder.</div>
`,

<h2>13.3 Floating-Point Numbers</h2>
<p>To store fractions and a wide range of values, computers use binary scientific notation: <b>M × 2<sup>E</sup></b>, where M is the <b>mantissa</b> (fractional part) and E is the <b>exponent</b> (power of 2). Here both use 8 bits, two's complement, binary point after the first bit.</p>
<table><tr><th>Mantissa place values</th><td>−1</td><td>½</td><td>¼</td><td>⅛</td><td>1/16</td><td>1/32</td><td>1/64</td><td>1/128</td></tr>
<tr><th>Exponent place values</th><td>−128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr></table>
<div class="sg-box tip">The first bit of each is the sign bit (two's complement): −1 for the mantissa, −128 for the exponent.</div>

<h3>Binary floating-point → denary</h3>
<div class="sg-box ex"><b>Example:</b> mantissa <code>01011010</code>, exponent <code>00000100</code>.<br>M = ½+⅛+1/16+1/64 = 45/64. E = 4.<br>M×2<sup>E</sup> = 45/64 × 16 = <b>11.25</b><br><i>Shortcut:</i> write mantissa as 0.1011010, move the point 4 places right → 01011.010 = 11.25.</div>

<h3>Denary → binary floating-point</h3>
<div class="sg-box ex"><b>Example: convert +4.5</b><br>4.5 = 9/2. Divide by 2 until the fraction is &lt;1: 9/16 (denominator&gt;numerator after 3 halvings) → exponent 2³ = <code>00000011</code>.<br>9/16 = ½+1/16 → mantissa <code>0.1001</code> padded to <code>01001000</code>.</div>

<h3>Rounding, normalisation, overflow</h3>
<ul>
<li><b>Rounding error</b> — numbers not linked to a power of two can only be stored approximately (limited mantissa bits) — this is why <code>0.1+0.1+0.1</code> may not print exactly 0.3.</li>
<li><b>Normalisation</b> — the standard form for best precision: positive mantissa starts <code>0.1…</code>, negative starts <code>1.0…</code>. Shift bits left to fix this; for every left shift, reduce the exponent by 1 (value unchanged).</li>
<li><b>Overflow</b> — result too large for the word size. <b>Underflow</b> — result too small to store. <b>Zero problem</b> — a normalised mantissa can't literally represent 0, so a special reserved pattern is used.</li>
</ul>
<h3>Precision vs range trade-off</h3>
<table><tr><th>Split (16-bit word)</th><th>Effect</th></tr>
<tr><td>More mantissa bits, fewer exponent bits</td><td>Higher precision, smaller range</td></tr>
<tr><td>Fewer mantissa bits, more exponent bits</td><td>Lower precision, much larger range</td></tr></table>
<div class="sg-box tip">Mantissa bits → precision. Exponent bits → range. Always a trade-off for a fixed word size.</div>
`
};

/* ---------- Chapter 15 — Hardware and Virtual Machines ---------- */
STUDY.ch15 = {
'15.1': `
<h2>15.1 Processors and Parallel Processing</h2>
<h3>RISC vs CISC</h3>
<p><b>CISC</b> — hardware handles complex, multi-cycle instructions (fewer lines of assembly). <b>RISC</b> — simple, single-cycle instructions, more of them, optimised with pipelining.</p>
<table><tr><th>CISC</th><th>RISC</th></tr>
<tr><td>Many instruction formats, more addressing modes</td><td>Fewer instruction formats/addressing modes</td></tr>
<tr><td>Multi-cycle instructions, variable length</td><td>Single-cycle instructions, fixed length</td></tr>
<tr><td>Longer execution time, complex decoding</td><td>Faster execution, general multi-purpose registers</td></tr>
<tr><td>Harder to pipeline; emphasis on hardware</td><td>Easier to pipeline; emphasis on software</td></tr></table>
<div class="sg-box warn">Know precisely which feature belongs to which — don't guess. If asked to state RISC features, answer only about RISC unless a comparison is explicitly requested.</div>
<p><b>Pipelining</b> (a RISC development): several instructions processed simultaneously, without waiting for one to fully complete before starting the next.</p>

<h3>SISD, SIMD, MISD, MIMD</h3>
<table><tr><th>Type</th><th>Meaning</th><th>Example</th></tr>
<tr><td>SISD</td><td>Single instruction, single data — one processor, sequential, no parallelism</td><td>Early PCs, simple single-core</td></tr>
<tr><td>SIMD</td><td>Many processors, same instruction, different data simultaneously</td><td>GPUs — e.g. 4000 processors each brightening one pixel at once</td></tr>
<tr><td>MISD</td><td>Several processors, different instructions, same shared data</td><td>Space Shuttle flight control (redundant fault-checking)</td></tr>
<tr><td>MIMD</td><td>Multiple processors, independent instructions AND independent data</td><td>Multicore chips, supercomputers</td></tr></table>
<div class="sg-box warn">Don't confuse SIMD (same instruction, many data) with MIMD (independent instructions and data) — the most common source of confusion.</div>
<p><b>Cluster</b> — networked computers, each remaining largely independent. <b>Massively parallel computer</b> — thousands of processors working together as one tightly-coupled system on one shared task, communicating via dedicated interconnects. Used for seismology, climate modelling, weather forecasting.</p>
`,
'15.2a': `
<h2>15.2 Boolean Algebra and Logic Circuits</h2>
<h3>Boolean notation</h3>
<p>NOT A = A' &nbsp;·&nbsp; AND = A.B &nbsp;·&nbsp; OR = A+B. Key identity: (A')' = A.</p>
<table><tr><th>Law</th><th>AND form</th><th>OR form</th></tr>
<tr><td>Commutative</td><td>A.B = B.A</td><td>A+B = B+A</td></tr>
<tr><td>Distributive</td><td>A.(B+C) = A.B+A.C</td><td>A+(B.C) = (A+B).(A+C)</td></tr>
<tr><td>Inverse</td><td>A.A' = 0</td><td>A+A' = 1</td></tr>
<tr><td>Absorption</td><td>A.(A+B) = A</td><td>A+(A.B) = A</td></tr>
<tr><td><b>De Morgan's</b></td><td>(A.B)' = A'+B'</td><td>(A+B)' = A'.B'</td></tr></table>
<div class="sg-box warn"><b>The #1 De Morgan's error (confirmed by examiner report):</b> when negating, you must BOTH distribute the NOT onto each term AND flip the operator. (A.B)' → <b>A'+B'</b>, NOT A'.B' (operator left unflipped is the common mistake).</div>
<div class="sg-box tip">When asked to "simplify," name the law used at each step (e.g. "using the distributive law...") — don't just jump to the final answer.</div>

<h3>Half adder and full adder</h3>
<p>Both are <b>combination circuits</b> (output depends only on current inputs, no memory).</p>
<table><tr><th></th><th>Inputs</th><th>Outputs</th></tr>
<tr><td>Half adder</td><td>A, B</td><td>Sum S = A.B'+A'.B (XOR); Carry C = A.B. Cannot accept a carry-in.</td></tr>
<tr><td>Full adder</td><td>A, B, Cin</td><td>Built from 2 half adders + an OR gate, so it can add a carry-in. Chain 4 full adders to add two 4-bit numbers.</td></tr></table>

<h3>Flip-flops (sequential circuits)</h3>
<p>Unlike combination circuits, a <b>sequential circuit's</b> output also depends on a previous output fed back in.</p>
<p><b>SR flip-flop</b> — two cross-coupled NOR (or NAND) gates. Inputs S(Set)/R(Reset), outputs Q/Q'.</p>
<table><tr><th>S</th><th>R</th><th>Effect</th></tr>
<tr><td>0</td><td>0</td><td>No change — remembers previous state</td></tr>
<tr><td>1</td><td>0</td><td>Set: Q=1</td></tr>
<tr><td>0</td><td>1</td><td>Reset: Q=0</td></tr>
<tr><td>1</td><td>1</td><td><b>Invalid</b> — Q and Q' would both be forced equal</td></tr></table>
<p><b>JK flip-flop</b> fixes SR's problems (invalid state, instability) by adding a clock. When J=1,K=1 the output <b>toggles</b> each clock pulse instead of being invalid. Used to build shift registers/binary counters.</p>
<div class="sg-box warn">When drawing a flip-flop: use exactly two cross-coupled gates of the <b>same type</b> (both NAND or both NOR) — mixing types is a common error.</div>
`,
'15.2b': `
<h2>15.2 Boolean Expressions and Karnaugh Maps</h2>
<h3>Deriving Boolean expressions from circuits</h3>
<p><b>Method 1:</b> trace the gates stage by stage. <b>Method 2 — sum of products (SoP):</b> from a truth table, take every row where the output = 1, write it as an AND term, then OR all those terms together.</p>
<div class="sg-box ex"><b>Example:</b> X=1 on rows A'B'C', A'BC', A'BC, AB'C', ABC' → SoP = A'.B'.C' + A'.B.C' + A'.B.C + A.B'.C' + A.B.C'</div>
<div class="sg-box warn">If asked for a sum-of-products, give it in that exact form — don't simplify into a different shape unless asked. Also check any stated circuit purpose (e.g. "full adder") actually matches your truth table.</div>

<h3>Karnaugh maps (K-maps)</h3>
<p>A grid using <b>Gray code</b> ordering (00, 01, 11, 10 — only one bit changes between adjacent cells), used to simplify Boolean expressions visually instead of algebraically.</p>
<ul>
<li>Only cells with a 1 are grouped.</li>
<li>Groups must have an <b>even</b> number of 1s (2, 4, 8...), as large as possible.</li>
<li>Groups can wrap around edges, and may overlap.</li>
<li>A variable is only kept in a group's term if it stays <b>constant</b> throughout that group.</li>
</ul>
<div class="sg-box ex"><b>Worked example:</b> 3 groups of two 1s found on a 3-variable map give terms B.C, A.C, A.B → simplified expression = <b>A.C + B.C + A.B</b>.</div>
<div class="sg-box warn">A fully correct K-map needs BOTH the 1s and the 0s filled in — leaving 0s blank loses marks. Don't forget wraparound loops when grouping.</div>
<div class="sg-box tip">K-maps become far more valuable than pure algebra as the number of variables grows (4+) — fewer steps, easier to spot the largest groups, less error-prone.</div>
`
};

/* ---------- Chapter 16 — System Software ---------- */
STUDY.ch16 = {
'16.1a': `
<h2>16.1 Process and Memory Management</h2>
<h3>Maximising resources</h3>
<p>The <b>kernel</b> is the OS's core — handles process management, memory management, interrupts, device management and I/O. A <b>DMA controller</b> lets hardware access RAM independently of the CPU: it initiates a transfer, frees the CPU for other work, then interrupts the CPU when done — this is how the OS keeps the CPU from sitting idle waiting on slow I/O.</p>
<p>The OS hides hardware complexity via a <b>GUI</b> instead of a CLI, <b>device drivers</b> (translate general instructions into hardware-specific ones), and file/folder abstractions instead of raw disk addresses.</p>

<h3>Process management: multitasking &amp; scheduling</h3>
<div class="sg-box def"><div>&#9654; <b>Interactive:</b> <a href="interrupt-lab.html#states-en" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">Process states simulator</a> &mdash; watch a video export, a photo app and a word processor move between ready, running and blocked, with the disk and keyboard interrupts (English / &#26085;&#26412;&#35486; / &#20013;&#25991; / &#3652;&#3607;&#3618;).</div></div>
<p>A <b>process</b> = a program that has started executing. <b>Multitasking</b> = the kernel rapidly switches between processes to give the appearance of simultaneity.</p>
<table><tr><th>Preemptive</th><th>Non-preemptive</th></tr>
<tr><td>Process gets a <b>quantum</b> (time slice); can be interrupted mid-execution</td><td>Process keeps the CPU until it finishes its <b>burst time</b> or voluntarily waits</td></tr>
<tr><td>Risk: low-priority processes starved</td><td>Risk: short processes starved behind a long one</td></tr></table>
<div class="sg-box def">&#9654; <b>Interactive:</b> <a href="interrupt-lab.html#sched" target="_blank" rel="noopener">Preemptive vs Non-preemptive simulator</a> &mdash; step through FCFS and Round Robin with P1 = 8 ms, P2 = 2 ms, P3 = 1 ms and compare waiting times.</div>

<h3>Scheduling algorithms (worked example: P1=23ms, P2=4ms, P3=9ms, P4=3ms)</h3>
<table><tr><th>Algorithm</th><th>Rule</th></tr>
<tr><td>FCFS (First Come First Served)</td><td>Non-preemptive, pure FIFO queue — order of arrival only</td></tr>
<tr><td>SJF (Shortest Job First)</td><td>Non-preemptive — shortest total burst time runs first</td></tr>
<tr><td>SRTF (Shortest Remaining Time First)</td><td>Preemptive version of SJF — a newly-arrived shorter job pre-empts the running one</td></tr>
<tr><td>Round Robin</td><td>Preemptive — each process gets one quantum in turn, cycling round</td></tr></table>
<div class="sg-box ex">FCFS on P1,P2,P3,P4: average wait = 21.5ms. SJF (shortest first): average wait = 6.5ms — a big improvement.</div>
<div class="sg-box def"><div>&#9654; <b>Interactive:</b> step through <a href="interrupt-lab.html#algo-en-fcfs" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">FCFS</a>, <a href="interrupt-lab.html#algo-en-sjf" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">SJF</a>, <a href="interrupt-lab.html#algo-en-srtf" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">SRTF</a> and <a href="interrupt-lab.html#algo-en-rr" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">Round Robin</a> one millisecond at a time, with the ready queue, CPU, Gantt chart and waiting times (English / &#26085;&#26412;&#35486; / &#20013;&#25991; / &#3652;&#3607;&#3618;).</div></div>

<h3>Process states</h3>
<table><tr><th>State</th><th>Meaning</th></tr>
<tr><td>Running</td><td>Currently executing on the CPU</td></tr>
<tr><td>Ready</td><td>Waiting in queue for CPU time, not blocked on anything</td></tr>
<tr><td>Blocked</td><td>Waiting for an I/O operation or event</td></tr></table>
<div class="sg-box warn">Always name the specific state and the specific event causing a transition (e.g. "moves from running to blocked because it requests an I/O operation") — never just "the process waits."</div>
<p>The <b>process control block (PCB)</b> stores a process's state, privileges, register values, priority, remaining CPU time and ID. <b>Context switching</b> saves/restores a process's state as it's pre-empted and resumed.</p>

<h3>Interrupts and the kernel as interrupt handler</h3>
<p>An <b>interrupt</b> signals the CPU to stop and deal with an urgent event. Types: device interrupts, exceptions (e.g. divide by zero), traps/software interrupts.</p>
<p>Exam-precise sequence: interrupt received (other interrupts disabled) → current task's state saved on the <b>kernel stack</b> → source and priority identified → jump to the interrupt service routine (found via the <b>interrupt dispatch table, IDT</b>) → state restored, interrupts re-enabled.</p>
<div class="sg-box tip">Interrupts are prioritised by <b>IPL</b> (0-31) — a running process is only suspended if the new interrupt's IPL is <i>greater</i> than the current one.</div>
<div class="sg-box def">&#9654; <b>Interactive:</b> <a href="interrupt-lab.html#en" target="_blank" rel="noopener">Interrupt simulator</a> &mdash; watch the kernel stack, IDT and ISR for 6 interrupt types (English / &#26085;&#26412;&#35486; / &#20013;&#25991; / &#3652;&#3607;&#3618;).</div>
`,
'16.1b': `
<h2>16.1 Memory Management (continued)</h2>
<h3>Paging vs segmentation</h3>
<table><tr><th>Paging</th><th>Segmentation</th></tr>
<tr><td>Fixed-size blocks (frames/pages)</td><td>Variable-size blocks (segments)</td></tr>
<tr><td>Risk: internal fragmentation</td><td>Risk: external fragmentation</td></tr>
<tr><td>Page table maps logical→physical</td><td>Segment map table (number+offset) maps logical→physical</td></tr>
<tr><td>Invisible to the user/programmer</td><td>Visible to the user/programmer</td></tr></table>
<div class="sg-box warn">A "difference" question needs ONE true fact about BOTH sides — a fact about only paging (or only segmentation) is not a difference.</div>
<div class="sg-box def"><div>&#9654; <b>Interactive:</b> <a href="interrupt-lab.html#mem-en-page" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">Paging</a> and <a href="interrupt-lab.html#mem-en-seg" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">segmentation</a> simulators &mdash; watch pages and segments move into RAM and follow an address through the table. See <a href="interrupt-lab.html#mem-en-int" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">internal</a> and <a href="interrupt-lab.html#mem-en-ext" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">external</a> fragmentation step by step (English / &#26085;&#26412;&#35486; / &#20013;&#25991; / &#3652;&#3607;&#3618;).</div></div>

<h3>Virtual memory</h3>
<p><b>Virtual memory = RAM + swap space on disk</b>, using <b>demand paging</b> (pages copied from disk only when needed). Gives the illusion of unlimited memory. Benefits: programs can exceed physical RAM, less fragmentation, no need for extra RAM.</p>
<div class="sg-box warn"><b>Critical distinction (confirmed by examiner report):</b> virtual memory ≠ virtual machine. Virtual memory extends RAM using disk. A virtual machine emulates a whole computer system via a hypervisor. Never conflate them — this scores zero either way.</div>
<p><b>Disk thrashing</b> — excessive swapping causes heavy disk head movement; if it gets bad enough, a <b>thrash point</b> is reached where the system is too busy paging to make progress. Fix: more RAM, fewer running programs, smaller swap file.</p>
<div class="sg-box def"><div>&#9654; <b>Interactive:</b> <a href="interrupt-lab.html#mem-en-virt" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">Virtual memory simulator</a> &mdash; watch a page move to the swap file, then a page fault, page replacement and disk thrashing (English / &#26085;&#26412;&#35486; / &#20013;&#25991; / &#3652;&#3607;&#3618;).</div></div>

<h3>Page replacement</h3>
<p>A <b>page fault</b> (an interrupt, not an error) occurs when a requested page isn't in memory. Goal: minimise page faults.</p>
<table><tr><th>Algorithm</th><th>Rule</th></tr>
<tr><td>FIFO</td><td>Replace the oldest page. Suffers <b>Belady's anomaly</b> (more frames can mean MORE faults)</td></tr>
<tr><td>Optimal (OPR)</td><td>Replace the page not needed for longest — theoretical only, needs future knowledge</td></tr>
<tr><td>LRU</td><td>Replace the page unused for longest in the past — practical approximation of Optimal</td></tr>
<tr><td>Clock/second-chance</td><td>Circular queue; replace if R-flag=0, else give a second chance</td></tr></table>
<div class="sg-box warn">Belady's anomaly is specific to <b>FIFO only</b> — don't claim more frames "always" reduces faults for every algorithm.</div>

<h3>Process vs memory management — don't confuse them</h3>
<p><b>Process management</b> decides <i>which</i> processes run and <i>in what order</i> (scheduling, process states). <b>Memory management</b> decides <i>where</i> data/programs are stored (paging, segmentation, virtual memory).</p>
<div class="sg-box warn">"Memory management manages memory" or "process management manages processes" earns ZERO — always name the specific mechanism. If a question excludes an example (e.g. "other than memory management..."), never repeat it even indirectly.</div>
`,
'16.2': `
<h2>16.2 Virtual Machines</h2>
<p>A <b>virtual machine (VM)</b> emulates one computer system inside another — e.g. running Apple software on a Windows PC. <b>Emulation</b> = imitating the behaviour of another program/device.</p>
<table><tr><th>Host OS</th><th>Guest OS</th></tr>
<tr><td>Controls the actual physical hardware; runs/monitors the VM software</td><td>Runs inside the VM, controlling virtual hardware, unaware it's "on an alien machine"</td></tr></table>
<p>The <b>hypervisor</b> is the VM software/emulation engine that maps virtual hardware (CPU, memory, HDD) to the host's real hardware.</p>
<p><b>Layering (bottom to top):</b> physical hardware → host OS → VM software (hypervisor) → guest OS(es) → applications.</p>

<h3>Benefits and limitations</h3>
<table><tr><th>Benefits</th><th>Limitations</th></tr>
<tr><td>Host and other VMs protected from a guest OS crash</td><td>Lower performance than running directly on hardware</td></tr>
<tr><td>Runs apps incompatible with the host (e.g. legacy software on new hardware)</td><td>Expensive to build in-house</td></tr>
<tr><td>Safe for testing a new OS/app — won't crash the host</td><td>Complex to manage and maintain</td></tr></table>
<div class="sg-box warn"><b>The #1 confirmed error (two separate examiner reports):</b> candidates give benefits/limitations of <b>virtual memory</b> when asked about <b>virtual machines</b>. If the question says "virtual machine," your whole answer must be about emulation, hypervisors, host/guest OS — not paging or disk swapping.</div>
`,
'16.3': `
<h2>16.3 Translation Software: Compilers, BNF, RPN</h2>
<h3>Interpreter vs compiler</h3>
<p>Key distinction: an <b>interpreter executes</b> the program it interprets; a <b>compiler does not execute</b> the program it compiles.</p>
<table><tr><th>Compiler</th><th>Interpreter</th></tr>
<tr><td>Translates the WHOLE program in one pass first</td><td>Translates and executes one <b>statement</b> at a time</td></tr>
<tr><td>Produces reusable object code</td><td>No object code produced — re-translated every run</td></tr>
<tr><td>Fast to re-run (object code reused)</td><td>Slow to re-run (source re-translated each time)</td></tr></table>
<div class="sg-box warn">Use the word "<b>statement</b>," never "line" — a real Cambridge mark scheme explicitly penalises "line."</div>

<h3>Stages of compilation</h3>
<ol>
<li><b>Lexical analysis</b> — removes whitespace/comments, converts to <b>tokens</b> (tokenisation) using a fixed <b>keyword table</b>; builds a fresh <b>symbol table</b> per program for identifiers.</li>
<li><b>Syntax analysis (parsing)</b> — checks tokens against grammar rules; if errors found, compilation stops before code generation.</li>
<li><b>Code generation</b> — produces the object program (direct machine code, or an intermediate form).</li>
<li><b>Optimisation</b> — improves the object code's efficiency.</li>
</ol>

<h3>Syntax diagrams and BNF</h3>
<p>Two equivalent ways to express a language's grammar: <b>syntax diagrams</b> (graphical — circles=fixed, stacked boxes=alternatives, loops=repetition) and <b>BNF</b> (textual).</p>
<table><tr><th>BNF symbol</th><th>Meaning</th></tr>
<tr><td>&lt; &gt;</td><td>Encloses an item to be defined</td></tr>
<tr><td>::=</td><td>"is defined as"</td></tr>
<tr><td>|</td><td>"or" (choice)</td></tr>
<tr><td>;</td><td>End of rule</td></tr></table>
<div class="sg-box ex">Recursive BNF for "any number of letters": &lt;variable&gt; ::= &lt;letter&gt; | &lt;variable&gt; &lt;letter&gt; ;</div>

<h3>Reverse Polish Notation (RPN)</h3>
<p>Postfix notation — operator written AFTER its operands (A+B → A B +). No brackets needed; can be evaluated strictly left-to-right with no backtracking.</p>
<div class="sg-box ex"><b>Converting:</b> A − B*C → convert highest precedence first (B*C → BC*) → A BC* − → <b>A B C * −</b></div>
<div class="sg-box ex"><b>Evaluating with a stack</b> (A B C * −, A=2,B=3,C=4): push 2, push 3, push 4 → operator * pops 4,3 → pushes 12 → operator − pops 12,2 → pushes 2−12 = <b>−10</b>.</div>
<div class="sg-box warn">An operator is NEVER pushed onto the stack — only values. Every operator triggers an immediate pop-pop-push. When asked WHY RPN is used, give the reason ("no need for brackets or precedence rules"), not just HOW it's evaluated.</div>
`
};

'17.1': `
<h2>17.1 Encryption Basics</h2>
<p>Encryption alters data so an <b>eavesdropper</b> cannot make sense of it. Four security concerns: <b>Confidentiality</b> (only intended recipient reads it), <b>Authenticity</b> (verify who sent it), <b>Integrity</b> (unaltered in transit), <b>Non-repudiation</b> (neither side can deny taking part).</p>
<div class="sg-box warn"><b>Exam-precise wording:</b> encryption does NOT prevent interception, and encrypted data is not "unreadable/inaccessible" — a hacker CAN still access it, but cannot <b>understand</b> it. Always say "prevents the data being understood."</div>
<p><b>Plaintext</b> → encryption algorithm + key → <b>ciphertext</b> → decryption algorithm + key → plaintext. A <b>block cipher</b> encrypts a whole group of bits at once (vs a <b>stream cipher</b>, one bit at a time).</p>

<h3>Symmetric encryption</h3>
<p>ONE secret key encrypts AND decrypts — both parties must already have the identical key. Real systems use 256-bit keys (2<sup>256</sup> combinations, computationally infeasible to brute-force).</p>
<div class="sg-box warn"><b>The key distribution problem</b> is the standard exam answer for symmetric encryption's biggest weakness: the shared key could be intercepted while being exchanged. A longer key does NOT fix this — length only resists brute-force, a separate issue.</div>

<h3>Asymmetric encryption</h3>
<p>TWO mathematically linked keys: a <b>public key</b> (shared freely) and a <b>private key</b> (kept secret). One key cannot feasibly be derived from the other.</p>
<table><tr><th>Private message (public → individual)</th><th>Verified message (individual → public)</th></tr>
<tr><td>Sender encrypts with the RECIPIENT'S public key. Only the recipient's private key can decrypt it.</td><td>Sender encrypts with THEIR OWN private key. Anyone can decrypt with the sender's public key — proves who sent it.</td></tr></table>
<div class="sg-box warn">Full-mark answer needs 4 points: (1) both generate a key pair, (2) the recipient's public key is shared with the sender, (3) sender encrypts with recipient's public key, (4) recipient decrypts with their own private key. Candidates usually get (3)/(4) but forget (1)/(2).</div>
`,
'17.2': `
<h2>17.2 Quantum Cryptography</h2>
<p>Instead of relying on a key being merely hard to guess, quantum cryptography uses the physics of <b>photons</b> to make interception <b>physically detectable</b>.</p>
<p>A <b>qubit</b> can be 0, 1, or both simultaneously until measured. Photon polarisations: vertical=1, horizontal=0, 45°right=1, 45°left=0 (diagonals represent 0 and 1 simultaneously until measured).</p>
<h3>QKD (Quantum Key Distribution) protocol — e.g. BB84</h3>
<ol>
<li>Sender generates photons, each passed through one of four random polarising filters (giving a random bit).</li>
<li>Photon travels via fibre-optic cable.</li>
<li>Recipient randomly picks one of two beam splitters (diagonal "X" or vertical/horizontal "Y") to read it.</li>
<li>This repeats until the whole key is sent.</li>
<li>Recipient sends back (over a normal, non-secure channel) which splitters were used.</li>
<li>Sender compares to the filters actually used, and tells recipient which positions <b>matched</b>.</li>
<li>Only the bit values from matching positions are kept as the final shared key.</li>
</ol>
<div class="sg-box tip">Any eavesdropping attempt physically disturbs the photon's quantum state, making interception detectable — this is what makes QKD virtually unbreakable, unlike classical encryption's reliance on computational difficulty alone.</div>
`,
'17.3': `
<h2>17.3 SSL and TLS</h2>
<h3>SSL (Secure Sockets Layer)</h3>
<p>Operates at the transport layer, secures client-server communication (e.g. browser ↔ web server). Normally only the <b>server is authenticated</b> — the client typically is not.</p>
<p>Three functions: <b>encryption</b>, <b>data compression</b>, <b>data integrity checks</b>.</p>
<div class="sg-box warn">Use these three precise terms — not vague phrases like "it makes the site safe." Visible indicator: https:// and a padlock icon — but that alone doesn't explain HOW SSL secures the connection.</div>
<p>Appropriate uses: online banking, e-commerce, email, cloud storage, VPNs, VoIP, instant messaging.</p>

<h3>TLS (Transport Layer Security)</h3>
<p>The more modern successor to SSL. Two layers: <b>Record protocol</b> (holds the actual data) and <b>Handshake protocol</b> (authenticates client/server, agrees encryption algorithms).</p>
<div class="sg-box warn"><b>Common exam error:</b> don't confuse the Handshake/Record protocols (internal to TLS) with unrelated application-layer protocols like HTTP or SMTP — different layer entirely.</div>
<table><tr><th>SSL</th><th>TLS</th></tr>
<tr><td>Older</td><td>More modern, based on SSL</td></tr>
<tr><td>Cannot easily add new authentication methods</td><td>Extensible with new authentication methods</td></tr>
<tr><td>No session caching</td><td>Supports <b>session caching</b> (resumes a previous session, boosting performance)</td></tr>
<tr><td>Handshake/record less separated</td><td>Cleanly separates Handshake from Record protocol</td></tr></table>

<h3>The TLS handshake, step by step</h3>
<ol><li>Client requests a secure (https) page.</li><li>Server sends its <b>digital certificate</b> (contains its public key).</li><li>Browser checks: (a) CA's signature against its trusted store, (b) validity dates, (c) domain name matches.</li><li>Browser generates a temporary session key using the certificate's public key.</li></ol>
`,
'17.4': `
<h2>17.4 Digital Signatures and Certificates</h2>
<h3>Digital signatures</h3>
<p>Instead of encrypting a whole message with the private key (slow), a <b>digest</b> (small fixed-size fingerprint) is used.</p>
<ol>
<li>Message passed through a hashing algorithm (e.g. MD5) → produces a <b>digest</b>.</li>
<li>Digest encrypted with the SENDER's private key → the <b>digital signature</b>.</li>
<li>Plaintext + signature sent together.</li>
<li>Recipient decrypts the signature with the sender's <b>public key</b> → recovers original digest.</li>
<li>Recipient independently hashes the received plaintext → produces a second digest.</li>
<li>If the two digests <b>match</b>, the message is authentic and unaltered.</li>
</ol>
<div class="sg-box warn">This process alone does NOT provide confidentiality — the plaintext travels unencrypted. For confidentiality too, you'd ALSO need to encrypt with the recipient's public key (17.1.3).</div>
<div class="sg-box warn"><b>Remaining weakness:</b> the sender's public key itself could be forged/substituted by an impersonator — this is exactly why CA-issued digital certificates are needed.</div>

<h3>Digital certificates</h3>
<p>An electronic document proving identity, containing a <b>public key</b> + owner details, issued by a <b>Certificate Authority (CA)</b> (e.g. Symantec, Entrust) after independently verifying the applicant.</p>
<p><b>Acquiring one:</b> apply to a CA → CA verifies identity → CA generates and issues the certificate.</p>
<div class="sg-box warn"><b>Self-signed certificates</b> (not CA-verified) are NOT trusted by browsers by default — users see a security warning. This is exactly why independent CA verification matters.</div>
<p>The certificate's own digital signature: all its details are hashed → digest encrypted with the <b>CA's private key</b>. Any browser holding the CA's public key can verify the certificate is genuine and unaltered.</p>
<div class="sg-box warn">"A digital certificate contains a public key" alone is only partial credit — full marks require explaining what that key is used FOR (validating the organisation's identity/private key).</div>
`
};

'18.1': `
<h2>18.1 Pathfinding Algorithms</h2>
<h3>Graphs — why AI uses them</h3>
<p>A <b>graph</b> records relationships between entities using <b>nodes</b> (vertices) and <b>edges</b> (connections), where edges may be <b>weighted</b> (a numerical cost — distance, time, money).</p>
<div class="sg-box warn">Exam-precise definition: mention BOTH nodes and edges, and that edges can be weighted — this is the full-mark phrasing.</div>

<h3>Dijkstra's algorithm</h3>
<p>Finds the shortest path between two nodes on a weighted graph. You must be able to <b>trace it by hand</b> — not code it.</p>
<ol>
<li>Give the start vertex a final value of 0.</li>
<li>Give every connected vertex a <b>working value</b> = final value of the vertex just reached + edge weight. Only replace an existing working value if the new one is lower.</li>
<li>The vertex with the smallest working value (among those without a final value) gets that value as its final value.</li>
<li>Repeat from step 2 until the destination has a final value.</li>
</ol>

<h3>A* algorithm</h3>
<p>Builds on Dijkstra's but adds a <b>heuristic</b> — an estimate (not exact) of remaining distance to the goal, letting it prioritise promising directions instead of expanding blindly in every direction.</p>
<table><tr><th>Value</th><th>Meaning</th></tr>
<tr><td>h</td><td>Heuristic — estimated remaining distance to goal (e.g. via the Manhattan method)</td></tr>
<tr><td>g</td><td>Actual movement cost from current node to the neighbour</td></tr>
<tr><td>f</td><td>f = g + h — total estimated cost; A* always expands the LOWEST f next</td></tr></table>
<div class="sg-box ex"><b>Manhattan method:</b> h = number of squares to cross to the goal, ignoring blocked squares. Movement cost: horizontal/vertical = 10, diagonal = 14 (approximating √200).</div>
`,
'18.2a': `
<h2>18.2 AI, Machine Learning and Deep Learning</h2>
<h3>How they relate (nested circles)</h3>
<p><b>AI</b> (outermost) — machines think/behave like humans. <b>Machine Learning</b> (middle) — systems learn without being explicitly programmed. <b>Deep Learning</b> (innermost) — machines process huge data via artificial neural networks, similar to the human brain.</p>
<div class="sg-box tip">Every deep learning system is also ML, and every ML system is also AI — but not every AI system uses ML, and not every ML system uses DL.</div>
<p>AI categories: <b>Narrow AI</b> (one task, better than a human — e.g. chess engine), <b>General AI</b> (human-level across any task), <b>Strong AI</b> (outperforms humans across many tasks).</p>

<h3>Machine learning types</h3>
<table><tr><th>Type</th><th>Data used</th><th>How it works</th></tr>
<tr><td>Supervised</td><td>Labelled (input + correct output known)</td><td>Trained against known answers, tested, refined; predicts outcomes on new data</td></tr>
<tr><td>Unsupervised</td><td>Unlabelled</td><td>Finds hidden patterns/clusters (e.g. k-means clustering) with no "right answer" given</td></tr>
<tr><td>Reinforcement</td><td>None — trial and error</td><td>Learns via reward/punishment feedback, maximising positive outcomes</td></tr>
<tr><td>Semi-supervised (active)</td><td>Small labelled + large unlabelled</td><td>Interactively queries data to reach the desired result — cheaper than fully labelling everything</td></tr></table>
<div class="sg-box tip"><b>Labelled data</b> = the correct classification is already known. <b>Unlabelled data</b> = objects are undefined, need recognising first.</div>

<h3>Deep learning — artificial neural networks</h3>
<p>Structured in layers: <b>input layer</b> (raw data) → <b>hidden layer(s)</b> (processes data) → <b>output layer</b> (final result). Connections carry <b>weightings</b>, initially random, refined through training (see 18.2.6, back propagation).</p>
<p>Deep learning can work with <b>unlabelled</b> data too — e.g. analysing pixel densities to recognise objects without manual labelling.</p>
`,
'18.2b': `
<h2>18.2 Comparison, Future and Backpropagation</h2>
<h3>Machine Learning vs Deep Learning</h3>
<table><tr><th>Machine Learning</th><th>Deep Learning</th></tr>
<tr><td>Needs only a small amount of training data</td><td>Needs LARGE amounts of data</td></tr>
<tr><td>Features must be identified in advance, manually coded</td><td>Learns features from the data itself</td></tr>
<tr><td>Modular approach — stages solved then combined</td><td>End-to-end — solved as one single entity</td></tr>
<tr><td>Testing takes a long time</td><td>Testing is much faster</td></tr>
<tr><td>Clear rules explain each stage's decisions</td><td>Reasoning is a "black box" — hard for humans to interpret</td></tr></table>
<div class="sg-box warn">Write comparison answers as MATCHED PAIRS (one ML point directly contrasted with the DL equivalent) — marks are for a stated <i>difference</i>, not a fact about only one side.</div>

<h3>Future developments (examples, by category)</h3>
<table><tr><th>Category</th><th>Example</th></tr>
<tr><td>AI</td><td>Predictive crime detection, humanoid androids</td></tr>
<tr><td>Machine Learning</td><td>Better healthcare diagnostics, marketing based on buying behaviour</td></tr>
<tr><td>Deep Learning</td><td>Hyper-personalised treatment, hyper-intelligent assistants</td></tr></table>
<div class="sg-box tip">To categorise a new example: relies on huge data + a neural network → Deep Learning. Learns from past behaviour without deep neural processing → Machine Learning. A broad capability not tied to a specific mechanism → AI generally.</div>

<h3>Back propagation of errors</h3>
<p>Neural network weightings start <b>random</b>. Back propagation trains them:</p>
<ol><li>Network produces initial (likely poor) outputs from training inputs.</li><li>Compare actual vs expected outputs → calculate the <b>error</b>.</li><li>Error is propagated backwards; calculus finds how much each neuron's weighting contributed.</li><li>Every weighting adjusted to reduce the error.</li><li>Repeat until error is eliminated or within an acceptable limit.</li></ol>

<h3>Regression vs classification (both used in supervised learning)</h3>
<table><tr><th>Regression</th><th>Classification</th></tr>
<tr><td>Predicts a <b>continuous numerical</b> value (e.g. tomorrow's temperature)</td><td>Predicts a <b>discrete category</b> (e.g. spam / not spam)</td></tr></table>
<div class="sg-box warn">Regression and classification are NOT the same thing — treat them as two separate named techniques.</div>
`

STUDY.ch19 = {
'19.1a': `
<h2>19.1 Search, Sort and Abstract Data Types</h2>
<div class="sg-box tip">Cambridge expects the 9618 pseudocode conventions (DECLARE, FOR...NEXT, REPEAT...UNTIL, WHILE...ENDWHILE) and a FULL TRACE TABLE (every variable at every step) — partial credit is usually for correct intermediate working, not just the final answer.</div>

<h3>Linear search</h3>
<p>Checks every element in order from the start until found or the list ends. Works on data in ANY order (sorted or not). Worst case: every element checked.</p>

<h3>Binary search</h3>
<p>Far more efficient, but REQUIRES the list to already be <b>sorted</b>. Repeatedly tests the middle item; discards the half that can't contain the target; repeats on the remaining half.</p>

<h3>Bubble sort</h3>
<p>Repeatedly compares adjacent pairs, swapping if out of order — the largest unsorted value "bubbles" to the end each pass. Stops when a full pass makes NO swaps.</p>
<div class="sg-box ex">[5,1,4,2,8] → pass 1: [1,4,2,5,8] → pass 2: [1,2,4,5,8] → pass 3: no swaps, done.</div>

<h3>Insertion sort</h3>
<p>Builds a sorted section one item at a time. Each new "key" is compared backwards against the sorted section; larger elements shift right to make room. Good for incremental/partially-sorted data.</p>

<h3>Abstract Data Types (ADTs)</h3>
<p>An ADT = a collection of data + a defined set of operations — defined by WHAT it does, not HOW it's implemented.</p>
<table><tr><th>ADT</th><th>Behaviour</th><th>Key operations</th></tr>
<tr><td><b>Stack</b></td><td>LIFO — Last In, First Out</td><td>push (add to top), pop (remove from top)</td></tr>
<tr><td><b>Queue</b></td><td>FIFO — First In, First Out</td><td>enqueue (add to rear), dequeue (remove from front)</td></tr>
<tr><td><b>Linked list</b></td><td>Nodes each pointing to the next</td><td>insert, delete, traverse via pointers</td></tr></table>
<div class="sg-box ex"><b>RPN evaluation with a stack</b> (5 3 4 * +): push 5, push 3, push 4 → * pops 4,3 pushes 12 → + pops 12,5 pushes <b>17</b>.</div>
<div class="sg-box warn">When asked to "describe key features," describe BEHAVIOUR (e.g. "LIFO") not a specific array/pointer implementation — that's a different sub-topic (19.1.4).</div>
`,
'19.1b': `
<h2>19.1 Implementing ADTs and Big-O</h2>
<h3>Implementing one ADT from another</h3>
<p>An ADT's definition can be built from built-in types (INTEGER) or other ADTs — e.g. a linked list implemented using an ARRAY of records (item + pointer).</p>
<div class="sg-box warn"><b>Confirmed exam trap:</b> when a question says "implement," describing the ADT abstractly (just "LIFO" or "pointers in the abstract") is NOT enough. You must name the actual array(s), the pointer variable names, their initial values, and exactly how each operation updates them.</div>
<div class="sg-box ex"><b>Model answer (linked list via array):</b> "Two 1D arrays are declared — one holds the data, the other holds the pointers as integers. Array elements with the same index make up one node. A start pointer variable holds the index of the first node. The last node's pointer is set to −1 (a null pointer, not a valid index)."</div>

<h3>Comparing algorithms: Big O notation</h3>
<p>Big O describes an algorithm's <b>worst-case</b> time or space complexity as the data size (n) grows — lets you compare algorithms independent of any specific computer's speed.</p>
<table><tr><th>Big O</th><th>Meaning</th><th>Example</th></tr>
<tr><td>O(1)</td><td>Constant — same time regardless of data size</td><td>Checking if a number is even/odd</td></tr>
<tr><td>O(log n)</td><td>Very efficient at scale — grows slowly</td><td>Binary search</td></tr>
<tr><td>O(n)</td><td>Linear — grows in direct proportion to n</td><td>Linear search</td></tr>
<tr><td>O(n²)</td><td>Grows with the square of n</td><td>Bubble sort, insertion sort</td></tr>
<tr><td>O(2ⁿ)</td><td>Doubles with every extra item — very inefficient</td><td>Naive recursive Fibonacci</td></tr></table>
<div class="sg-box tip">For huge datasets, O(n) vs O(n²) can mean seconds vs days. Binary search's O(log n) requires sorted data in exchange for that efficiency.</div>
`,
'19.2': `
<h2>19.2 Recursion</h2>
<h3>What recursion is</h3>
<p>A function/procedure defined in terms of itself. Every valid recursive routine needs exactly two parts:</p>
<ul><li><b>Base case</b> — a non-recursive, directly-answerable terminating case.</li><li><b>General case</b> — defined in terms of a SMALLER version of the same problem, moving closer to the base case.</li></ul>
<div class="sg-box warn">No reachable base case → <b>infinite recursion</b> → exhausts the call stack → <b>stack overflow</b> runtime error.</div>
<div class="sg-box ex"><b>Factorial:</b> base case 0!=1; general case n! = n × (n−1)!. factorial(3): calls down to factorial(0)=1, then unwinds: 1×1=1, 2×1=2, 3×2=<b>6</b>.</div>

<h3>How a compiler implements recursion — the call stack</h3>
<p>Every function call creates a <b>stack frame</b> (return address + local variables) on the <b>call stack</b>. Recursion is special because MANY of a routine's own stack frames can exist on the stack simultaneously — one per unfinished call.</p>
<table><tr><th>Winding</th><th>Unwinding</th></tr>
<tr><td>Repeated self-calls, pushing new stack frames, base case not yet reached — nothing computed yet</td><td>Base case reached; each paused call resumes, computes its answer, and pops its stack frame off</td></tr></table>
<div class="sg-box warn">Deep/unbounded recursion risks a stack overflow because each pushed frame consumes real memory not released until it unwinds — this is also why recursion generally uses MORE memory than the equivalent iterative loop (which needs only one stack frame).</div>
`
};

'20.1': `
<h2>20.1 Programming Paradigms</h2>
<div class="sg-box tip">A paradigm isn't "better" in the abstract — each suits different problems. Justify a choice by connecting to the PROBLEM's nature (e.g. "this needs direct hardware control, so low-level"), not just "X is good."</div>

<h3>Low-level programming</h3>
<p>Uses assembly language/machine code directly — precise control over memory/registers (e.g. device drivers). Maximum control and efficiency, but slow to write, hard to read, poor portability.</p>
<table><tr><th>Addressing mode</th><th>Meaning</th></tr>
<tr><td>Immediate</td><td>The operand IS the actual data value</td></tr>
<tr><td>Direct</td><td>Operand gives the memory address holding the data</td></tr>
<tr><td>Indirect</td><td>Operand gives an address that itself contains the address of the data (pointer to a pointer)</td></tr>
<tr><td>Indexed</td><td>Address = operand + contents of the index register (IX)</td></tr>
<tr><td>Relative</td><td>Used in branching — address is an offset from the current program counter</td></tr></table>

<h3>Imperative (procedural) programming</h3>
<p>Steps written explicitly in the exact order executed. "Structured programming" = a disciplined version adding procedures/functions with properly scoped variables. Smaller/faster than OOP for simple programs, but hard to maintain as programs grow large.</p>

<h3>Object-oriented programming (OOP)</h3>
<table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Class</td><td>A template defining methods/data for a type of object (no real data until an object is made)</td></tr>
<tr><td>Object / Instance</td><td>A created variable of a class type — a self-contained unit with its own data + methods</td></tr>
<tr><td>Attribute</td><td>A data item defined within a class</td></tr>
<tr><td>Method</td><td>A procedure/function defined as part of a class</td></tr></table>
<p><b>Encapsulation</b> — bundling data + methods together as one unit (the class). <b>Data hiding</b> — restricting outside access via private attributes + public methods.</p>
<table><tr><th>Constructor</th><th>Setter</th><th>Getter</th><th>Destructor</th></tr>
<tr><td>Initialises a new object</td><td>Controls changes to a private variable</td><td>Returns a property's value</td><td>Destroys an object, frees memory</td></tr></table>

<h3>Declarative programming</h3>
<p>States <b>facts</b> and <b>rules</b>, then poses a <b>query</b> (a "goal") — no step-by-step sequence given. Prolog is the syllabus's worked example; SQL SELECT is also declarative (describes WHAT is wanted, not HOW to find it).</p>
<div class="sg-box warn"><b>Prolog syntax (exam-tested exactly):</b> facts/rules are lower case and end with a full stop. Query VARIABLES start with a capital letter. Getting either wrong is one of the most heavily penalised mistakes.</div>
<div class="sg-box ex"><code>country(france).</code> is a fact. <code>?- language(Country,english).</code> is a query using variable Country.</div>
`,
'20.2': `
<h2>20.2 Files and Exception Handling</h2>
<h3>File processing operations</h3>
<table><tr><th>Mode</th><th>Meaning</th></tr>
<tr><td>Read</td><td>Reads data; existing contents unchanged</td></tr>
<tr><td>Write</td><td>Writes data; existing data is OVERWRITTEN</td></tr>
<tr><td>Append</td><td>Adds to the end, without disturbing existing data</td></tr></table>
<p>Key operations: <code>OPEN...FOR</code>, <code>PUTRECORD</code>, <code>GETRECORD</code>, <code>SEEK</code> (jump directly to an address — random access), <code>CLOSEFILE</code>, <code>EOF()</code>.</p>
<div class="sg-box warn">Every file that is opened MUST be closed — leaving it open wastes resources and can lose unsaved data. Every OPEN must be matched by a CLOSE, correctly placed (not lost inside the wrong part of a loop).</div>
<table><tr><th>Organisation</th><th>Description</th><th>Access</th></tr>
<tr><td>Serial</td><td>Order added, no field ordering</td><td>Sequential only</td></tr>
<tr><td>Sequential</td><td>Sorted by key field</td><td>Sequential, or direct via an index</td></tr>
<tr><td>Random</td><td>Location computed via a hashing function</td><td>Direct access</td></tr></table>

<h3>Exception handling</h3>
<p>An <b>exception</b> = an unexpected event disrupting normal execution (programming errors, user errors, hardware failure). Exception handling makes a program more <b>robust</b> by trapping the error instead of crashing.</p>
<div class="sg-box warn">Simple input validation only guards against problems the programmer can anticipate in advance. Exception handling is for UNPREDICTABLE runtime failures outside the program's control (a file deleted externally, a printer losing power, a dropped connection) — validation and exception handling are NOT the same thing.</div>
<div class="sg-box ex"><b>TRY/EXCEPT structure:</b><br><code>TRY<br>&nbsp;&nbsp;&lt;statements that might raise an exception&gt;<br>EXCEPT<br>&nbsp;&nbsp;&lt;statements that run only if an exception was raised&gt;<br>ENDTRY</code><br>If an exception occurs, the rest of the TRY block is skipped immediately and control jumps to EXCEPT. A <b>FINALLY</b> block (where supported) always runs regardless — commonly used to guarantee files get closed.</div>
<table><tr><th>Exception</th><th>Typical cause</th></tr>
<tr><td>Division by zero</td><td>Dividing by zero / arithmetic overflow</td></tr>

/* ---------- Chapter 14 — Communication and Internet Technologies ---------- */
STUDY.ch14 = {
'14.1': `
<h2>14.1 Protocols</h2>
<p>Whenever two devices communicate across a network, both sides must agree in advance on the exact rules governing that communication — a <b>protocol</b>. A protocol defines syntax (data format), semantics (meaning) and timing.</p>
<div class="sg-box def"><b>Exam rule:</b> a protocol is a set of rules — it cannot "do" anything itself. It is always the <b>device</b> that acts, <i>because the protocol requires it</i>. Write "the sending device transmits the data, as required by the protocol," never "the protocol sends the data."</div>
<div class="sg-box warn"><b>A-Level vs AS-Level:</b> "a protocol is a set of rules" alone earns no credit. The A-Level point: protocols are essential because they enable communication between devices on <b>different platforms/manufacturers</b> — always state this explicitly.</div>

<h3>Protocols as a layered stack (TCP/IP, 4 layers)</h3>
<p>Breaking the process into independent layers (<b>decomposition</b>) lets each layer be developed/replaced independently, keeps different manufacturers' hardware compatible, and each layer only ever talks to the layer directly above/below it. Data passes <b>down</b> the stack at the sender (each layer adding a header = <b>encapsulation</b>) and <b>up</b> at the receiver (each layer stripping its header).</p>
<table><tr><th>Layer</th><th>Function</th><th>Protocols</th></tr>
<tr><td><b>4 Application</b></td><td>Programs/services exchanging data with the user</td><td>HTTP, FTP, SMTP, POP3/4, IMAP, BitTorrent</td></tr>
<tr><td><b>3 Transport</b></td><td>Splits message into segments, adds port numbers, manages reliable end-to-end delivery</td><td>TCP</td></tr>
<tr><td><b>2 Internet</b></td><td>Exam phrasing: <i>"source and destination IP addresses are added to the packet header"</i></td><td>IP</td></tr>
<tr><td><b>1 Link</b></td><td>Physical transmission on the local network; uses MAC addresses</td><td>Ethernet, Wi-Fi</td></tr></table>
<div class="sg-box warn">"It uses IP addresses" is NOT enough for the Internet layer — the exact required phrasing is "source and destination IP addresses are added to the packet header."</div>

<h3>Application-layer protocols</h3>
<ul>
<li><b>HTTP</b> — transfers web pages; browser sends a request, server sends a response + status code. HTTPS = HTTP secured with TLS.</li>
<li><b>FTP</b> — transfers whole files; uses a separate <b>control connection</b> (commands) and <b>data connection</b> (file contents).</li>
<li><b>SMTP</b> — <b>sending</b> mail only, a <b>push protocol</b> (client keeps connection open, uploads as sent).</li>
<li><b>POP3/POP4</b> — <b>receiving</b> mail, downloads then <b>deletes from server</b> (pull protocol) — best for one device.</li>
<li><b>IMAP</b> — <b>receiving</b> mail, keeps messages on the server, <b>synchronised</b> across devices.</li>
</ul>
<div class="sg-box warn"><b>Common mistake:</b> IMAP is NOT a sending protocol. Only SMTP sends. POP3/4 and IMAP only receive.</div>

<h3>BitTorrent — peer-to-peer (P2P)</h3>
<p>No central file server — peers share files directly with each other, all of equal status.</p>
<table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Peer</td><td>Any client in the P2P community</td></tr>
<tr><td>Swarm</td><td>The whole group sharing one file</td></tr>
<tr><td>Tracker</td><td>Coordinates which peers have which pieces — does NOT hold/transfer the file itself</td></tr>
<tr><td>Seed</td><td>Has the complete file, keeps sharing it</td></tr>
<tr><td>Leech</td><td>Still downloading (may also upload)</td></tr>
<tr><td>Lurker</td><td>Downloads but never uploads back</td></tr></table>
<div class="sg-box ex"><b>Worked example:</b> ratio = uploaded ÷ downloaded. Uploaded 200MB, downloaded 800MB → ratio = 200/800 = <b>0.25</b> (took more than contributed).</div>
`,
'14.2': `
<h2>14.2 Circuit and Packet Switching</h2>
<h3>Circuit switching</h3>
<p>A dedicated circuit is reserved for the <b>entire duration</b> of one communication (e.g. a phone call). Three stages: <b>Establish</b> → <b>Transfer</b> → <b>Terminate</b>.</p>
<table><tr><th>Pros</th><th>Cons</th></tr>
<tr><td>No other traffic competes; constant predictable delay; data arrives in order (one fixed path)</td><td>Inflexible — line reserved even when idle; if any link on the path fails, the whole connection is lost</td></tr></table>
<div class="sg-box tip">Best suited to real-time voice/video, where predictable delay matters more than efficiency.</div>

<h3>Packet switching</h3>
<p>A message is split into <b>packets</b>, each sent independently and possibly by a <b>different route</b>; reassembled at the destination using sequence numbers.</p>
<table><tr><th>Packet header field</th><th>Purpose</th></tr>
<tr><td>Source / destination IP</td><td>Who sent it / where it must go</td></tr>
<tr><td>Sequence number</td><td>Position in the message, for reassembly if packets arrive out of order</td></tr>
<tr><td>Hop count (TTL)</td><td>Decreased by 1 at every router; packet discarded at 0 — stops endless circulation</td></tr>
<tr><td>Checksum</td><td>Error-detection value; recalculated at destination to detect corruption</td></tr></table>

<h3>Role of a router (full exam sequence)</h3>
<ol><li><b>Receives</b> the packet</li><li><b>Reads/checks</b> the destination address</li><li>Consults its <b>routing table</b></li><li><b>Forwards</b> the packet toward the next hop, hop count −1</li></ol>
<div class="sg-box warn">"It connects the LAN to the internet" earns NO marks — you must give the full receive → check → routing table → forward sequence. Say "packet," never "package" or "data."</div>

<table><tr><th>Pros of packet switching</th><th>Cons</th></tr>
<tr><td>Bandwidth shared efficiently; can route around failures; easy to expand capacity</td><td>More complex protocols; lost packets must be resent; variable delay (poor for real-time)</td></tr></table>
<div class="sg-box warn">Every benefit/drawback needs TWO parts: name it, then the mechanism. "Faster" alone = 0 marks. Model answer: "completeness of message, because missing packets can be detected and a re-send request sent."</div>

<h3>Circuit vs packet — comparison</h3>
<table><tr><th>Feature</th><th>Circuit</th><th>Packet</th></tr>
<tr><td>Path</td><td>Dedicated, set up first</td><td>Independent per packet, no path set up in advance</td></tr>
<tr><td>Order</td><td>Always in order</td><td>May arrive out of order — reassembled by sequence number</td></tr>
<tr><td>Bandwidth</td><td>Reserved even if idle</td><td>Shared, not wasted</td></tr>
<tr><td>Best for</td><td>Real-time voice/video</td><td>Web browsing, email, file downloads</td></tr>
<tr><td>Failure</td><td>Whole connection lost</td><td>Routed around the fault</td></tr></table>
<div class="sg-box warn">"Packet switching is always better" is wrong — for real-time voice/video, circuit switching's predictable delay can be preferable. Justify with the scenario, not a blanket rule. Don't bring in pros/cons when asked only to "describe the process."</div>
`
};

let quizState = null; // {chId, setIdx, questions, cur, score, ac}

function renderQuizPicker(){
  document.getElementById('quiz-picker').style.display='';
  document.getElementById('quiz-set-picker').style.display='none';
  document.getElementById('quiz-play').style.display='none';
  document.getElementById('quiz-results').style.display='none';

  grid.innerHTML = CHAPTERS.map(c=>`
    <div class="card" style="--ac:var(${c.color})" onclick="quizPickChapter('${c.id}')">
      <div class="icon">${c.icon}</div><h3>Ch${c.num} — ${c.title}</h3>
      <div class="sub">${(QB[c.id]||[]).length} quiz set${(QB[c.id]||[]).length===1?'':'s'}</div>
    </div>`).join('');
}
function quizPickChapter(chId){
  const ch = CHAPTERS.find(c=>c.id===chId);
  document.getElementById('quiz-picker').style.display='none';
  document.getElementById('quiz-set-picker').style.display='';
  document.getElementById('quiz-set-title').textContent = `Ch${ch.num} — ${ch.title}`;
  const grid = document.getElementById('quiz-set-grid');
  const sets = QB[chId] || [];
  grid.innerHTML = ch.units.map((u,i)=>`
    <div class="card" style="--ac:var(${ch.color})" onclick="startQuiz('${chId}',${i})">
      <h3>${u.id} ${u.title}</h3>
      <div class="sub">${(sets[i]||[]).length} question${(sets[i]||[]).length===1?'':'s'}</div>
    </div>`).join('');
}
function quizBackToPicker(){ renderQuizPicker(); }

function shuffleArray(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function prepareQuestions(rawSet){
  return shuffleArray(rawSet).map(q=>{
    const order = shuffleArray(q.o.map((opt,i)=>i));
    return { q:q.q, h:q.h, f:q.f, o:order.map(i=>q.o[i]), a:order.indexOf(q.a) };
  });
}
function startQuiz(chId, setIdx){
  const ch = CHAPTERS.find(c=>c.id===chId);
  const rawSet = (QB[chId]||[])[setIdx] || [];
  quizState = { chId, setIdx, ch, questions: prepareQuestions(rawSet), cur:0, score:0 };
  document.getElementById('quiz-set-picker').style.display='none';
  document.getElementById('quiz-play').style.display='';
  renderQ();
}
function renderQ(){
  const s = quizState;
  const box = document.getElementById('quiz-play');
  if(s.cur >= s.questions.length){ return showQuizResults(); }
  const q = s.questions[s.cur];
  box.innerHTML = `
    <div class="quiz-box" style="--ac:var(${s.ch.color})">
      <div class="qmeta"><span>${s.ch.title}</span><span>Question ${s.cur+1} / ${s.questions.length}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${(s.cur/s.questions.length)*100}%"></div></div>
      <div class="qtext">${q.q}</div>
      <div id="opts">${q.o.map((opt,i)=>`<button class="opt" onclick="checkAns(${i})">${opt}</button>`).join('')}</div>
      <div id="fb"></div>
    </div>`;
}
function checkAns(i){
  const s = quizState, q = s.questions[s.cur];
  document.querySelectorAll('#opts .opt').forEach((btn,idx)=>{
    btn.onclick = null;
    if(idx===q.a) btn.classList.add('correct');
    else if(idx===i) btn.classList.add('wrong');
  });
  if(i===q.a) s.score++;
  document.getElementById('fb').innerHTML = `
    <div class="feedback"><b>${i===q.a?'✅ Correct.':'❌ Not quite.'}</b> ${q.f||''}</div>
    <button class="btn" style="margin-top:14px" onclick="nextQ()">Continue →</button>`;
}
function nextQ(){ quizState.cur++; renderQ(); }
function showQuizResults(){
  const s = quizState;
  document.getElementById('quiz-play').style.display='none';
  document.getElementById('quiz-results').style.display='';
  const pct = Math.round((s.score/s.questions.length)*100);
  const tier = pct>=90?'🏆 Excellent':pct>=75?'👍 Good':pct>=50?'📚 Keep revising':'🔁 Review this unit';
  document.getElementById('quiz-results').innerHTML = `
    <div class="quiz-box" style="--ac:var(${s.ch.color});text-align:center">
      <div class="result-tier">${tier}</div>
      <p style="font-size:1.3em;font-weight:700">${s.score} / ${s.questions.length} correct (${pct}%)</p>
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:center">
        <button class="btn sec" onclick="quizPickChapter('${s.chId}')">Choose another unit</button>
        <button class="btn" onclick="startQuiz('${s.chId}',${s.setIdx})">Retry this unit</button>
      </div>
    </div>`;
}

let mockState = null; // {test, questions, cur, score, timeLeft, timerId}

function renderMockList(){
  document.getElementById('mock-picker').style.display='';
  document.getElementById('mock-play').style.display='none';
  document.getElementById('mock-results').style.display='none';
  const list = document.getElementById('mock-list');

      <div><h3>${t.title}</h3><div class="sub" style="color:var(--mut)">${t.picks.length} questions · ${Math.round(t.seconds/60)} min</div></div>
      <button class="btn" onclick="startMock(${i})">Start</button>
    </div>`).join('');
}
function resolveMockQuestions(test){
  return test.picks.map(p=>{
    const raw = QB[p.ch][p.set][p.q];
    const order = shuffleArray(raw.o.map((opt,i)=>i));
    return { q:raw.q, h:raw.h, f:raw.f, o:order.map(i=>raw.o[i]), a:order.indexOf(raw.a), chColor:CHAPTERS.find(c=>c.id===p.ch).color };
  });
}
function startMock(idx){
  const test = MOCK_TESTS[idx];
  mockState = { test, questions: shuffleArray(resolveMockQuestions(test)), cur:0, score:0, timeLeft: test.seconds };
  document.getElementById('mock-picker').style.display='none';
  document.getElementById('mock-play').style.display='';
  renderMockQ();
  mockState.timerId = setInterval(mockTick, 1000);
}
function mockTick(){
  mockState.timeLeft--;
  updateTimerBar();
  if(mockState.timeLeft<=0){ clearInterval(mockState.timerId); showMockResults(); }
}
function updateTimerBar(){
  const pct = Math.max(0, mockState.timeLeft / mockState.test.seconds) * 100;
  const fill = document.getElementById('mock-timer-fill');
  if(!fill) return;
  fill.style.width = pct+'%';
  fill.style.background = pct<15?'#dc2626':pct<40?'#d97706':'#059669';
  const m = Math.floor(mockState.timeLeft/60), s2 = mockState.timeLeft%60;
  document.getElementById('mock-timer-text').textContent = `${m}:${s2.toString().padStart(2,'0')} remaining`;
}
function renderMockQ(){
  const s = mockState;
  const box = document.getElementById('mock-play');
  if(s.cur >= s.questions.length){ clearInterval(s.timerId); return showMockResults(); }
  const q = s.questions[s.cur];
  box.innerHTML = `
    <div class="timer-text" id="mock-timer-text"></div>
    <div class="timer-bar"><div class="timer-fill" id="mock-timer-fill"></div></div>
    <div class="quiz-box" style="--ac:var(${q.chColor})">
      <div class="qmeta"><span>${s.test.title}</span><span>Question ${s.cur+1} / ${s.questions.length}</span></div>
      <div class="qtext">${q.q}</div>
      <div id="mopts">${q.o.map((opt,i)=>`<button class="opt" onclick="mockCheckAns(${i})">${opt}</button>`).join('')}</div>
      <div id="mfb"></div>
    </div>`;
  updateTimerBar();
}
function mockCheckAns(i){
  const s = mockState, q = s.questions[s.cur];
  document.querySelectorAll('#mopts .opt').forEach((btn,idx)=>{
    btn.onclick = null;
    if(idx===q.a) btn.classList.add('correct');
    else if(idx===i) btn.classList.add('wrong');
  });
  if(i===q.a) s.score++;
  document.getElementById('mfb').innerHTML = `
    <div class="feedback"><b>${i===q.a?'✅ Correct.':'❌ Not quite.'}</b> ${q.f||''}</div>
    <button class="btn" style="margin-top:14px" onclick="mockNextQ()">Continue →</button>`;
}
function mockNextQ(){ mockState.cur++; renderMockQ(); }
function showMockResults(){
  const s = mockState;
  document.getElementById('mock-play').style.display='none';
  document.getElementById('mock-results').style.display='';
  const pct = Math.round((s.score/s.questions.length)*100);
  const tier = pct>=90?'🏆 Excellent':pct>=75?'👍 Good':pct>=50?'📚 Keep revising':'🔁 Review these chapters';
  document.getElementById('mock-results').innerHTML = `
    <div class="quiz-box" style="text-align:center">
      <div class="result-tier">${tier}</div>
      <p style="font-size:1.3em;font-weight:700">${s.score} / ${s.questions.length} correct (${pct}%)</p>
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:center">
        <button class="btn sec" onclick="renderMockList()">Back to mock tests</button>
      </div>
    </div>`;
}

/* init */
renderHome();
</script>
</body>
</html>
