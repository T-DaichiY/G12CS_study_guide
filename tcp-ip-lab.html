<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>TCP/IP Stack Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Sarabun:wght@400;700&display=swap">
<style>
/* Light theme only, same lab-notebook look as the Topic 16 OS Lab.
   Layout: two protocol stacks side by side with a router between them; one colour per layer, and each header keeps the colour of the layer that added it. */
:root{
  --bg:#F3F6FB;--panel:#FFFFFF;--ink:#1F2A3C;--muted:#586479;--line:#D3DCEA;--soft:#E9EEF7;
  --accent:#3B6FD4;--accent-soft:#E4ECFB;--accent-ink:#1F4AA8;--on-accent:#FFFFFF;
  --app:#B8A7F3;--app-s:#EEEAFD;--app-d:#5B43B5;
  --tra:#8DB4F2;--tra-s:#E7EFFD;--tra-d:#1F4AA8;
  --int:#8ED3A5;--int-s:#E6F6EC;--int-d:#23774A;
  --lnk:#F5C76A;--lnk-s:#FDF3DA;--lnk-d:#8A5A00;
  --f-display:"Bricolage Grotesque","Zen Kaku Gothic New","Noto Sans SC","Sarabun",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Zen Kaku Gothic New","Noto Sans SC","Sarabun",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.ja{--f-body:"Zen Kaku Gothic New","Atkinson Hyperlegible",system-ui,sans-serif}
body.zh{--f-body:"Noto Sans SC","Atkinson Hyperlegible",system-ui,sans-serif}
body.th{--f-body:"Sarabun","Atkinson Hyperlegible",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.6vw,3.2rem);font-weight:800;letter-spacing:-.01em;line-height:1.15}
h2{font-size:1.3rem}
h3{font-size:1rem}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:66ch}
header{padding-block:18px 0;display:grid;gap:14px}
.top{display:flex;justify-content:flex-end;gap:6px;padding-top:14px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.note{font-size:.88rem;color:var(--muted);max-width:75ch}
button{font:inherit;font-size:.92rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:38px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.btn.primary,.top button[aria-pressed="true"],.pbtns button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.steps{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.steps button{min-height:30px;min-width:34px;padding:2px 8px;font-family:var(--f-mono);font-size:.8rem}
.steps button.now{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps button.seen{background:var(--accent-soft)}

/* the two stacks and the router */
.net{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr);grid-template-rows:auto repeat(4,minmax(58px,auto));gap:6px 12px;margin-top:14px}
.hh{align-self:end}
.hh h3{font-size:1rem}
.hh p{font-size:.78rem;color:var(--muted);line-height:1.3}
.hh.b{text-align:right}
.hh.m{text-align:center}
.layer{border:2px solid;border-radius:10px;padding:6px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;transition:box-shadow .3s,opacity .3s;min-width:0}
.layer .ln{font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:.02em}
.layer .lp{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);grid-column:1;line-height:1.2}
.layer .slot{grid-column:2;grid-row:1/3;min-width:56px;min-height:50px;display:flex;align-items:center;justify-content:center}
.layer.app{background:var(--app-s);border-color:var(--app)} .layer.app .ln{color:var(--app-d)}
.layer.tra{background:var(--tra-s);border-color:var(--tra)} .layer.tra .ln{color:var(--tra-d)}
.layer.int{background:var(--int-s);border-color:var(--int)} .layer.int .ln{color:var(--int-d)}
.layer.lnk{background:var(--lnk-s);border-color:var(--lnk)} .layer.lnk .ln{color:var(--lnk-d)}
.layer.hot{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 40%,transparent)}
.layer.dim{opacity:.55}
.b .layer,.layer.b{grid-template-columns:auto minmax(0,1fr)}
.layer.b .slot{grid-column:1} .layer.b .ln,.layer.b .lp{grid-column:2;text-align:right}
.mid{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.mid.cloud{grid-row:2/4;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.8rem;text-align:center;padding:6px;flex-direction:column}
.mid .slot{min-width:20px;min-height:38px;display:flex;align-items:center;justify-content:center;flex:1}
.rbox{border:2px solid;border-radius:10px;padding:4px 8px;font-family:var(--f-display);font-weight:800;font-size:.82rem;text-align:center;flex:0 1 auto;min-width:0}
.rbox.int{background:var(--int-s);border-color:var(--int);color:var(--int-d)}
.rbox.lnk{background:var(--lnk-s);border-color:var(--lnk);color:var(--lnk-d)}
.rbox small{display:block;font-family:var(--f-body);font-weight:400;font-size:.66rem;color:var(--muted);line-height:1.2}
.wire{position:relative}
.wire>*{position:relative;z-index:2}
.dirs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1fr);gap:12px;margin-top:4px;font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.dirs span:last-child{text-align:right}

/* the tunnel: a slim glass tube that follows the path of the data; the data unit travels inside it */
.tube{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible;filter:drop-shadow(0 2px 3px rgba(31,42,60,.10))}
.tube path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tube .to{stroke:#9DB2DA}
.tube .ti{stroke:#FFFFFF;opacity:.86}
.tube .tp{stroke:var(--accent);opacity:.17}
.tube .tf{stroke:var(--accent);opacity:.55;stroke-width:2.5;stroke-dasharray:1 11;animation:flow 1.1s linear infinite}
.tube .tg{stroke:#C3CFE6;stroke-width:2.5;stroke-dasharray:1 11}
@keyframes flow{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.tube .tf{animation:none}}
.slot{position:relative;z-index:2}
.rbox{position:relative;z-index:2}
.rbox.rslot{display:grid;justify-items:center;gap:1px;min-width:92px;padding-bottom:5px}
.rbox.rslot .slot{min-height:30px;min-width:50px;flex:none}
.layer .ln,.layer .lp{position:relative;z-index:2}
/* the travelling data unit: turned to match the direction of the tunnel */
.tok{display:inline-flex;align-items:stretch;gap:0;border-radius:7px;overflow:hidden;border:2px solid var(--ink);box-shadow:0 2px 5px rgba(31,42,60,.22);will-change:transform;background:var(--panel)}
.tok i{display:block;width:7px;height:22px}
.tok i.d{width:16px}
.tok.v{flex-direction:column}
.tok.v i{width:22px;height:7px}
.tok.v i.d{height:16px}
.tok .bitsT{font-family:var(--f-mono);font-size:.62rem;padding:0 4px;align-self:center;white-space:nowrap;line-height:22px}
.c-fh,.c-ft{background:var(--lnk)} .c-ih{background:var(--int)} .c-th{background:var(--tra)} .c-data{background:var(--app)}

/* inspector */
.insp{margin-top:14px;display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:14px;align-items:stretch}
@media (max-width:760px){.insp{grid-template-columns:minmax(0,1fr)}}
.unit{border-radius:12px;border:3px solid;padding:10px 14px;display:grid;align-content:center;gap:2px}
.unit .ul{font-size:.74rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.unit .un{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1.15}
.unit .uy{font-family:var(--f-mono);font-size:.74rem}
.unit.app{background:var(--app-s);border-color:var(--app)} .unit.app .un{color:var(--app-d)}
.unit.tra{background:var(--tra-s);border-color:var(--tra)} .unit.tra .un{color:var(--tra-d)}
.unit.int{background:var(--int-s);border-color:var(--int)} .unit.int .un{color:var(--int-d)}
.unit.lnk,.unit.bits{background:var(--lnk-s);border-color:var(--lnk)} .unit.lnk .un,.unit.bits .un{color:var(--lnk-d)}
.pdu{display:flex;gap:0;align-items:stretch;min-width:0;overflow-x:auto;border-radius:10px}
.part{flex:1 1 0;min-width:108px;padding:8px 10px;border:2px solid var(--ink);border-left-width:0;display:grid;align-content:start;gap:3px;position:relative}
.part:first-child{border-left-width:2px;border-radius:10px 0 0 10px}
.part:last-child{border-radius:0 10px 10px 0}
.part:only-child{border-radius:10px}
.part .pt{font-family:var(--f-display);font-weight:800;font-size:.86rem}
.part dl{margin:0;display:grid;gap:1px;font-size:.74rem}
.part dt{color:var(--muted);font-size:.66rem;line-height:1.1}
.part dd{margin:0 0 3px;font-family:var(--f-mono);font-size:.72rem;line-height:1.2;word-break:break-all}
.part.data{flex:1.3 1 0}
.part.data dd{font-size:.82rem;font-weight:600}
.part .tg{position:absolute;top:-1px;right:-1px;font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:0 0 0 6px;background:var(--accent);color:var(--on-accent)}
.part.new .pt,.part.chg .pt{margin-top:16px}
.part.new{animation:pop .5s ease-out}
.part.chg dd.v{background:#FFF;outline:2px solid var(--accent);border-radius:3px;padding:0 3px}
@keyframes pop{from{transform:scaleX(.2);opacity:0}to{transform:none;opacity:1}}
.bitsrow{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.12em;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--lnk-s);overflow:hidden;white-space:nowrap;flex:1}
.bitsrow small{display:block;font-family:var(--f-body);letter-spacing:0;color:var(--muted);margin-top:4px;white-space:normal}
.extra{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.86rem}
.extra .sq{display:inline-flex;gap:4px}
.extra .sq b{font-family:var(--f-mono);font-size:.76rem;padding:2px 8px;border-radius:6px;background:var(--tra);border:1px solid var(--tra-d)}
.extra .ack{font-family:var(--f-mono);font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.msg{margin-top:12px;padding:12px 16px;border-radius:10px;background:var(--soft);border-left:4px solid var(--accent);display:grid;gap:6px}
.msg .tag{font-family:var(--f-mono);font-size:.76rem;color:var(--accent-ink);font-weight:600}
.msg h3{font-size:1.1rem}
.msg .exam{font-size:.92rem;padding:8px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.msg .exam b{font-size:.74rem;color:var(--muted);display:block}

.why{margin:8px 0 0;padding-left:1.2em;display:grid;gap:6px;max-width:80ch}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:640px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.76rem;color:var(--muted)}
td.l{font-family:var(--f-display);font-weight:800;white-space:nowrap}
tr.app td.l{box-shadow:inset 6px 0 0 var(--app);background:var(--app-s)}
tr.tra td.l{box-shadow:inset 6px 0 0 var(--tra);background:var(--tra-s)}
tr.int td.l{box-shadow:inset 6px 0 0 var(--int);background:var(--int-s)}
tr.lnk td.l{box-shadow:inset 6px 0 0 var(--lnk);background:var(--lnk-s)}
td.u{font-weight:700}
td.m{font-family:var(--f-mono);font-size:.8rem}

.pbtns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pbtns button{font-family:var(--f-mono);font-weight:600}
.pcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:820px){.pcard{grid-template-columns:minmax(0,1fr)}}
.pdiag{overflow-x:auto}
.pdiag svg{min-width:460px}
.pdiag .tb{stroke-linecap:round}
.pdiag .tb.o{stroke:#9FB0CE;stroke-width:28}
.pdiag .tb.i{stroke:#F8FAFF;stroke-width:23}
.pdiag .tb.on{stroke:#D6E3FB;stroke-width:23}
.pdiag .fl.on{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 5}
.pdiag .fll{font-size:12.5px;fill:var(--accent-ink);font-weight:700;paint-order:stroke;stroke:var(--soft);stroke-width:4px;stroke-linejoin:round}
.pdiag .nm{font-size:12.5px;font-weight:700}
.pdiag .stt{font-family:var(--f-mono);font-size:11.5px;fill:var(--muted)}
.pdiag .nb{transition:fill .3s}
.pdiag .nb.got{stroke-width:4;fill:var(--accent-soft)}
.pdiag .pill rect{fill:var(--accent);stroke:#fff;stroke-width:1.5}
.pdiag .pill text{fill:#fff;font-weight:700;font-size:12px}
.pseqH{margin-top:16px}
.pseq{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.pseq button{width:100%;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 12px;font-size:.94rem;line-height:1.5}
.pseq button b{font-family:var(--f-mono);font-size:.78rem;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.pseq button.now{border-color:var(--accent);background:var(--accent-soft)}
.pseq button.now b{background:var(--accent);color:var(--on-accent)}
.pseq button.todo{opacity:.55}
.pbtns button{display:grid;gap:0;text-align:left;padding:6px 12px;line-height:1.3}
.pbtns button small{font-family:var(--f-body);font-weight:400;font-size:.76rem;opacity:.85}
.pact{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 12px;border-radius:10px;margin-bottom:8px;border:2px solid #E58E73;background:#FDEDE7;font-weight:700;min-height:52px}
.pact .who{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);padding:2px 10px 2px 4px;border-radius:999px;background:#E58E73;color:#fff;white-space:nowrap}
.pact .who svg{width:22px;height:22px}
.pact.auto{border:2px dashed var(--line);background:var(--panel);color:var(--muted);font-weight:400}
.pact.auto .who{background:var(--soft);color:var(--muted)}
.scr{margin-top:14px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--panel);max-width:22rem}
.scrL{font-size:.72rem;font-weight:700;color:var(--muted);padding:4px 10px;background:var(--soft);border-bottom:1px solid var(--line)}
.scrB{padding:0 0 8px;font-size:.9rem;min-height:8.4rem}
.scrB div{padding:3px 12px}
.scrB div:first-child{font-family:var(--f-mono);font-size:.8rem;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;padding:6px 12px;margin-bottom:5px;word-break:break-all}
.pdiag .pp circle{fill:#C9D3E3}
.pdiag .pp path{fill:#fff}
.pdiag .pp text{font-size:12px;font-weight:700;fill:var(--muted)}
.pdiag .pp.act circle{fill:#E58E73}
.pdiag .pp.act text{fill:#B4543A}
.pdiag .pp .ring{fill:none;stroke:#E58E73;stroke-width:2;opacity:0}
.pdiag .pp.act .ring{animation:tap 1.1s ease-out 2}
@keyframes tap{from{opacity:.9;r:11px}to{opacity:0;r:26px}}
.pseq .ha{display:block;font-weight:700;color:#B4543A}
/* practice block */
.ex h3{margin-top:18px;font-size:1.1rem}
.ex h3:first-of-type{margin-top:10px}
.ex ul{margin:8px 0 0;padding-left:1.2em;display:grid;gap:6px;max-width:82ch}
.exq{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.exq .mk,.mq .mk{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.exq .al{font-size:.76rem;font-weight:700;color:var(--muted);margin-top:8px}
.exq ul{margin-top:4px}
.pits{list-style:none!important;padding:0!important}
.pits li{display:grid;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.pits .bad{color:#A33A2B}
.pits .good{color:#1E6A41;font-weight:700}
.mq{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.mo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
@media (max-width:640px){.mo{grid-template-columns:minmax(0,1fr)}}
.mo button{text-align:left}
.mo button:disabled{opacity:1}
.mo button b{font-family:var(--f-mono);margin-right:6px}
.mo button.ok{background:#E6F6EC;border-color:#23774A;font-weight:700}
.mo button.no{background:#FCE9E5;border-color:#A33A2B}
.mw{margin-top:8px;font-size:.92rem}
.mw.ok{color:#1E6A41}.mw.no{color:#A33A2B}
.score{margin-top:12px;font-family:var(--f-mono);font-weight:600}
.pcard h3{font-size:1.4rem}
.pcard h3 small{display:block;font-family:var(--f-body);font-weight:400;font-size:.86rem;color:var(--muted)}
.pinfo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin-top:10px;font-size:.94rem}
.pinfo dt{font-size:.76rem;font-weight:700;color:var(--muted);padding-top:3px}
.pinfo dd{margin:0}
.pinfo dd.ty{font-family:var(--f-mono);font-size:.82rem;color:var(--app-d)}
.pdiag{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:6px}
.pdiag svg{display:block;width:100%;height:auto}
.pdiag text{font-family:var(--f-body);font-size:13px;fill:var(--ink)}
.pdiag .nb{fill:var(--panel);stroke:var(--app-d);stroke-width:2}
.pdiag .nb.srv{stroke:var(--int-d)}
.pdiag .nb.dash{stroke-dasharray:5 4;stroke:var(--muted)}
.pdiag .fl{stroke:#8FA0BC;stroke-width:2;fill:none}
.pdiag .fl.dash{stroke-dasharray:4 4}
.pdiag .fll{font-size:11.5px;fill:var(--muted)}
.pdiag .dot{fill:var(--accent)}
.pdiag .nt{font-size:12px;fill:var(--lnk-d);font-weight:700}
@media (max-width:640px){
  .net{gap:5px 6px;grid-template-columns:minmax(0,1fr) minmax(0,.62fr) minmax(0,1fr)}
  .layer{padding:5px 6px;grid-template-columns:minmax(0,1fr)!important}
  .layer .ln{font-size:.72rem;grid-column:1!important;text-align:left!important}
  .layer .lp{display:none}
  .layer .slot{grid-column:1!important;grid-row:auto;min-width:0;justify-content:center}
  .tok i{width:5px;height:16px}.tok i.d{width:11px}.tok.v i{width:16px;height:5px}.tok.v i.d{height:11px}
  .layer .slot{min-height:38px}.rbox.rslot{min-width:0;padding:3px 4px}.rbox.rslot .slot{min-width:36px;min-height:22px}
  .rbox{font-size:.66rem;padding:3px 4px}.rbox small{display:none}
  .hh p{display:none}.hh h3{font-size:.8rem}
  .dirs{display:none}
  .part{min-width:96px}
}
@media (prefers-reduced-motion:reduce){.part.new{animation:none}}
</style>

<script>
(function(){

const KEYS=['app','tra','int','lnk'];
/* values that are not translated */
const V={mac1:{dmac:'BB-BB-BB-00-00-01',smac:'AA-AA-AA-00-00-0A'},mac2:{dmac:'CC-CC-CC-00-00-0B',smac:'BB-BB-BB-00-00-02'},

/* pos = slot id, parts = what is wrapped around the data, unit = name, hot = highlighted boxes, nw = parts added in this step */
const STEPS=[
 {pos:'s-0',parts:['data'],unit:'app',hot:['A0'],nw:[]},
 {pos:'s-1',parts:['th','data'],unit:'tra',hot:['A1'],nw:['th'],seg:1},
 {pos:'s-2',parts:['ih','th','data'],unit:'int',hot:['A2'],nw:['ih'],seg:1},
 {pos:'s-3',parts:['fh','ih','th','data','ft'],unit:'lnk',hot:['A3'],nw:['fh','ft'],mac:'mac1',seg:1},
 {pos:'p-wire1',parts:'bits',unit:'bits',hot:['A3','R3'],nw:[]},
 {pos:'p-router',parts:['fh','ih','th','data','ft'],unit:'lnk',hot:['R2','R3'],nw:[],mac:'mac2',chg:true,seg:1},
 {pos:'r-3',parts:['fh','ih','th','data','ft'],unit:'lnk',hot:['B3'],nw:[],mac:'mac2',seg:1},
 {pos:'r-2',parts:['ih','th','data'],unit:'int',hot:['B2'],nw:[],seg:1},
 {pos:'r-1',parts:['th','data'],unit:'tra',hot:['B1'],nw:[],seg:1,reorder:true},
 {pos:'r-0',parts:['data'],unit:'app',hot:['B0'],nw:[]},
 {pos:'r-0',parts:['data'],unit:'app',hot:['B0','B1','B2','B3'],nw:[],resp:true}
];
let lang='en',k=0,timer=null,proto='http';
const tok=document.createElement('span');tok.className='tok';
const T=()=>TX[lang];
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

function staticText(){
  const t=T();document.documentElement.lang=lang==='zh'?'zh-Hans':lang;document.body.className=lang;
  document.querySelectorAll('[data-t]').forEach(e=>{const v=t.ui[e.dataset.t];if(v!==undefined)e.textContent=v;});
  LANGS.forEach(l=>$('lg-'+l).setAttribute('aria-pressed',l===lang));
  KEYS.forEach((key,i)=>{['A','B'].forEach(s=>{const el=$(s+i);el.querySelector('.ln').textContent=t.layers[i].n;el.querySelector('.lp').textContent=t.layers[i].p;});});
  $('R2').querySelector('.rn').textContent=t.layers[2].n;$('R3').querySelector('.rn').textContent=t.layers[3].n;
  $('why').innerHTML=t.why.map(w=>'<li>'+w+'</li>').join('');
  $('ltab').innerHTML='<thead><tr>'+t.ui.tcol.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+t.layers.map((L,i)=>
    '<tr class="'+KEYS[i]+'"><td class="l">'+L.n+'</td><td>'+L.purpose+'</td><td class="u">'+t.units[KEYS[i]]+'</td><td>'+L.addr+'</td><td class="m">'+L.p+'</td></tr>').join('')+'</tbody>';
  $('steps').innerHTML=STEPS.map((s,i)=>'<button data-i="'+i+'">'+i+'</button>').join('');
  $('steps').querySelectorAll('button').forEach(b=>b.onclick=()=>{stop();go(+b.dataset.i,true);});
  $('pbtns').innerHTML=t.protocols.map(p=>'<button data-k="'+p.k+'" aria-pressed="'+(p.k===proto)+'"><b>'+p.n+'</b><small>'+p.use+'</small></button>').join('');
  $('pbtns').querySelectorAll('button').forEach(b=>b.onclick=()=>{pstop();proto=b.dataset.k;pk=0;drawProto(true);});
  drawProto(false);drawExam();
}

function partHTML(p,s,t){
  const F=t.fields,mac=V[s.mac||'mac1'];let rows=[];
  if(p==='fh')rows=[['dmac',mac.dmac],['smac',mac.smac]];
  if(p==='ih')rows=[['sip',V.sip],['dip',V.dip]];
  if(p==='th')rows=[['sport',V.sport],['dport',V.dport],['seq',V.seq]];
  if(p==='ft')rows=[['crc',V.crc]];
  if(p==='data')rows=[['',s.resp?t.ui.respData:V.data]];
  const isNew=s.nw.includes(p),chg=s.chg&&p==='fh';
  return '<div class="part c-'+p+(p==='data'?' data':'')+(isNew?' new':'')+(chg?' chg':'')+'">'+
    (isNew?'<span class="tg">'+t.ui.newTag+'</span>':chg?'<span class="tg">'+t.ui.changedTag+'</span>':'')+
    '<span class="pt">'+F[p]+'</span><dl>'+rows.map(r=>(r[0]?'<dt>'+F[r[0]]+'</dt>':'')+'<dd class="v">'+r[1]+'</dd>').join('')+
    (p==='data'&&s.seg?'<dt>'+t.ui.segNote+'</dt>':'')+'</dl></div>';
}

function go(n,anim){
  k=Math.max(0,Math.min(STEPS.length-1,n));
  const t=T(),s=STEPS[k];
  // token
  const first=tok.isConnected?tok.getBoundingClientRect():null;
  tok.className='tok'+(/^[sr]-/.test(s.pos)?' v':'');
  tok.innerHTML=s.parts==='bits'?'<span class="bitsT">0110…</span>':s.parts.map(p=>'<i class="c-'+p+(p==='data'?' d':'')+'"></i>').join('');
  $(s.pos).appendChild(tok);
  if(anim&&first&&!reduce()){const l=tok.getBoundingClientRect(),dx=first.left-l.left,dy=first.top-l.top;
    if(Math.abs(dx)>1||Math.abs(dy)>1)tok.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:750,easing:'cubic-bezier(.3,.7,.2,1)'});}
  drawTube();
  // highlight
  document.querySelectorAll('.layer,.rbox').forEach(e=>{e.classList.toggle('hot',s.hot.includes(e.id));});
  document.querySelectorAll('.layer').forEach(e=>e.classList.toggle('dim',!s.hot.includes(e.id)&&((k<5&&e.id[0]==='B')||(k>5&&k<10&&e.id[0]==='A'))));
  // inspector
  const u=$('unit');u.className='unit '+s.unit;$('unitN').textContent=t.units[s.unit];
  const li={app:0,tra:1,int:2,lnk:3,bits:3}[s.unit];$('unitY').textContent=t.layers[li].n+' '+t.ui.layerL;
  $('pdu').innerHTML=s.parts==='bits'?'<div class="bitsrow">01001000 11010110 00101101 10100011 01110100 10010111 00011010 11100101 …<small>'+t.ui.bitsNote+'</small></div>':s.parts.map(p=>partHTML(p,s,t)).join('');
  const ex=$('extra');ex.hidden=!s.reorder;
  if(s.reorder)ex.innerHTML='<span>'+t.ui.reorderL+'</span><span class="sq"><b>seq 1</b><b>seq 3</b><b>seq 2</b></span><span>→ '+t.ui.reorderR+'</span><span class="sq"><b>seq 1</b><b>seq 2</b><b>seq 3</b></span><span class="ack">'+t.ui.ack+'</span>';
  // message
  const m=t.steps[k];
  $('mTag').textContent='STEP '+k+' · '+t.units[s.unit];
  $('mT').textContent=m.t;$('mR').innerHTML=m.r;$('mX').textContent=m.x;
  $('back').disabled=k===0;$('next').disabled=k===STEPS.length-1;
  $('steps').querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('now',i===k);b.classList.toggle('seen',i<k);});
  $('play').textContent=timer?t.ui.pause:t.ui.play;
}

/* the tunnel through both stacks, drawn from the real positions of the slots */
const TM=['s-0','s-1','s-2','s-3','p-wire1','R3','p-wire2','r-3','r-2','r-1','r-0'],TI=[0,1,2,3,4,5,7,8,9,10,10];
function roundPath(p,r){
  let d='M'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);
  for(let i=1;i<p.length-1;i++){
    const a=p[i-1],c=p[i],b=p[i+1],l1=Math.hypot(a[0]-c[0],a[1]-c[1]),l2=Math.hypot(b[0]-c[0],b[1]-c[1]);
    if(l1<1||l2<1)continue;
    const u=[(a[0]-c[0])/l1,(a[1]-c[1])/l1],v=[(b[0]-c[0])/l2,(b[1]-c[1])/l2];
    if(Math.abs(u[0]*v[1]-u[1]*v[0])<.05){d+=' L'+c[0].toFixed(1)+' '+c[1].toFixed(1);continue;}
    const q=Math.min(r,l1/2,l2/2);
    d+=' L'+(c[0]+u[0]*q).toFixed(1)+' '+(c[1]+u[1]*q).toFixed(1)+' Q'+c[0].toFixed(1)+' '+c[1].toFixed(1)+' '+(c[0]+v[0]*q).toFixed(1)+' '+(c[1]+v[1]*q).toFixed(1);
  }
  const e=p[p.length-1];return d+' L'+e[0].toFixed(1)+' '+e[1].toFixed(1);
}
function drawTube(){
  const net=$('net').getBoundingClientRect();if(!net.width)return;
  const c=id=>{const r=$(id).getBoundingClientRect();return [r.left+r.width/2-net.left,r.top+r.height/2-net.top];};
  const pt=TM.map(c),small=net.width<520,w=small?24:34,R=small?12:20;
  // one straight run along the bottom, and a short branch up into the router's Internet layer
  const yb=pt[5][1];[3,4,6,7].forEach(i=>pt[i][1]=yb);pt[0][0]=pt[1][0]=pt[2][0]=pt[3][0];pt[8][0]=pt[9][0]=pt[10][0]=pt[7][0];
  const up=c('p-router'),br=[[pt[5][0],yb],[pt[5][0],up[1]]];
  const all=roundPath(pt,R),brd='M'+br[0][0].toFixed(1)+' '+br[0][1].toFixed(1)+' L'+br[1][0].toFixed(1)+' '+br[1][1].toFixed(1);
  const n=TI[k],done=pt.slice(0,n+1);if(done.length<2)done.push(pt[0]);
  const part=roundPath(done,R),withBr=k>=5;
  const P=(cls,d,sw)=>'<path class="'+cls+'" d="'+d+'"'+(sw?' stroke-width="'+sw+'"':'')+'/>';
  $('tube').setAttribute('viewBox','0 0 '+net.width+' '+net.height);
  $('tube').innerHTML=P('to',all,w+3)+P('to',brd,w+3)+P('ti',all,w)+P('ti',brd,w)+P('tp',part,w)+(withBr?P('tp',brd,w):'')+P('tg',all)+P('tf',part)+(k===5?P('tf',brd):'');
}

/* step-by-step animation for each of the six protocols.
   n = nodes [name key, x, y, kind, suffix]; init = text under each node before step 1;
   s = steps: m = messages [from, to], st = text under each node after the step, hl = nodes to highlight when nothing moves */
const PW=150,PH=52;
/* a node may carry a person: [name key, x, y, kind, suffix, person]; "by" = the node whose person acts in that step */
const PD={
 http:{h:160,n:[['browser',85,88,0,'','Ana'],['web',475,88,1]],init:['—',''],s:[
  {by:0,m:[[0,1]],st:['—','']},{m:[[1,0]],st:['HTML','']},{m:[[0,1]],st:['HTML','']},{m:[[1,0]],st:['HTML + JPG','']},{by:0,m:[[0,1]],st:['HTML + JPG','']}]},
 ftp:{h:160,n:[['client',85,88,0,'','Tom'],['ftp',475,88,1]],init:['📄 2','📄 1'],s:[
  {by:0,m:[[0,1]],st:['📄 2','📄 1']},{m:[[1,0]],st:['📄 2','📄 1']},
  {by:0,m:[[0,1]],st:['📄 2','📄 3']},{by:0,m:[[1,0]],st:['📄 3','📄 3']}]},
 smtp:{h:240,n:[['mailc',85,64,0,'','Mia'],['mailA',475,64,1],['mailR',475,190,1],['rdev',85,190,0,'','Ken']],init:['✉ 1','✉ 0','✉ 0','✉ 0'],s:[
  {by:0,m:[[0,1]],st:['✉ 0','✉ 1','✉ 0','✉ 0']},{m:[[1,2]],st:['✉ 0','✉ 0','✉ 1','✉ 0']},
  {m:[],hl:[2],st:['✉ 0','✉ 0','✉ 1','✉ 0']},{by:3,m:[[2,3]],st:['✉ 0','✉ 0','✉ 1','✉ 1']},{by:3,m:[],hl:[3],st:['✉ 0','✉ 0','✉ 1','✉ 1 · 🖼']}]},
 pop3:{h:190,note:'pop3',n:[['mailB',85,88,1],['laptop',475,88,0,'','Ken']],init:['✉ 3','✉ 0'],s:[
  {by:1,m:[[1,0]],st:['✉ 3','✉ 0']},{m:[[0,1]],st:['✉ 3','✉ 3']},{m:[[1,0]],st:['✉ 0','✉ 3']},{by:1,m:[],hl:[1],st:['✉ 0','✉ 3']}]},
 imap:{h:250,note:'imap',n:[['mailB',280,42,1],['laptop',85,175,0,'','Ken'],['phone',475,175,0,'','Ken']],init:['●●●','—','—'],s:[
  {by:1,m:[[1,0]],st:['●●●','—','—']},{m:[[0,1]],st:['●●●','●●●','—']},{by:1,m:[[1,0]],st:['○●●','○●●','—']},{by:2,m:[[0,2]],st:['○●●','○●●','○●●']}]},
 bt:{h:322,note:'bt',n:[['tracker',85,38,2],['peer',85,160,0,'A','Sam'],['peer',475,45,0,'B'],['peer',475,152,0,'C'],['peer',475,259,0,'D']],init:['','□□□□','■■■■','■■□□','□□□■'],s:[
  {by:1,m:[[1,0]],st:['','□□□□','■■■■','■■□□','□□□■']},{m:[[0,1]],st:['','□□□□','■■■■','■■□□','□□□■']},
  {m:[[2,1],[3,1]],st:['','■□■□','■■■■','■■□□','□□□■']},{m:[[1,4],[2,1]],st:['','■□■■','■■■■','■■□□','■□□■']},
  {by:1,m:[[3,1]],st:['','■■■■ seed','■■■■','■■□□','■□□■']}]}
};
const PERSON='<circle r="11"/><path d="M0 -6.2a3.2 3.2 0 1 0 .01 0zM-6.2 6.6c.6-4 3-5.6 6.2-5.6s5.6 1.600 6.2 5.6z"/>';
let pk=0,ptimer=null,pRun=0;
function pEnds(d,a,b){
  const A=d.n[a],B=d.n[b],dx=B[1]-A[1],dy=B[2]-A[2],len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;
  const e=Math.min(Math.abs(ux)>0.001?(PW/2)/Math.abs(ux):1e9,Math.abs(uy)>0.001?(PH/2)/Math.abs(uy):1e9);
  return [A[1]+ux*(e+4),A[2]+uy*(e+4),B[1]-ux*(e+10),B[2]-uy*(e+10),Math.abs(dx)<1];
}
function drawProto(anim){
  const t=T(),p=t.protocols.find(x=>x.k===proto),d=PD[proto],tx=t.psteps[proto];
  pk=Math.max(0,Math.min(d.s.length-1,pk));
  const cur=d.s[pk],prev=pk?d.s[pk-1].st:d.init,f=v=>v.toFixed(1);
  $('pbtns').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===proto));
  $('pN').innerHTML=p.use+'<small>'+p.n+' · '+p.f+'</small>';$('pP').textContent=p.purpose;$('pT').textContent=p.type;$('pK').textContent=p.point;
  let s='<svg viewBox="0 0 560 '+d.h+'" role="img" aria-label="'+p.n+'"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3B6FD4"/></marker></defs>';
  // every pair of nodes that talks gets a tunnel
  const seen={},ln=(c,a,b)=>'<line class="tb '+c+'" x1="'+d.n[a][1]+'" y1="'+d.n[a][2]+'" x2="'+d.n[b][1]+'" y2="'+d.n[b][2]+'"/>';
  let outer='',inner='';
  d.s.forEach(x=>x.m.forEach(([a,b])=>{const key=Math.min(a,b)+'-'+Math.max(a,b);if(seen[key])return;seen[key]=1;outer+=ln('o',a,b);inner+=ln('i',a,b);}));
  s+=outer+inner;
  const runs=[];let labs='';
  cur.m.forEach(([a,b],j)=>{
    const [x1,y1,x2,y2,vert]=pEnds(d,a,b),lab=tx[pk].l[j]||'';runs.push([x1,y1,x2,y2,lab]);
    s+=ln('on',a,b)+'<path class="fl on" d="M'+f(x1)+' '+f(y1)+' L'+f(x2)+' '+f(y2)+'" marker-end="url(#ah)"/>';
    if(lab)labs+=vert?'<text class="fll" x="'+f(x1+20)+'" y="'+f((y1+y2)/2+4)+'">'+lab+'</text>':'<text class="fll" text-anchor="middle" x="'+f((x1+x2)/2)+'" y="'+f((y1+y2)/2-20)+'">'+lab+'</text>';
  });
  d.n.forEach(([key,x,y,kind,suf],ni)=>{
    s+='<rect id="pn'+ni+'" class="nb'+(kind===1?' srv':kind===2?' dash':'')+'" x="'+(x-PW/2)+'" y="'+(y-PH/2)+'" width="'+PW+'" height="'+PH+'" rx="10"/>'+
      '<text class="nm" text-anchor="middle" x="'+x+'" y="'+(y-3)+'">'+t.ui.nodes[key]+(suf?' '+suf:'')+'</text><text class="stt" id="ps'+ni+'" text-anchor="middle" x="'+x+'" y="'+(y+16)+'"></text>';});
  d.n.forEach(([key,x,y,kind,suf,per],ni)=>{if(!per)return;
    s+='<g class="pp'+(cur.by===ni&&tx[pk].a?' act':'')+'" transform="translate('+(x-PW/2+13)+','+(y-PH/2-15)+')"><circle class="ring" r="11"/>'+PERSON+'<text x="16" y="4.5">'+per+'</text></g>';});
  s+=labs;
  const act=tx[pk].a,showScr=()=>{$('scrL').textContent=t.ui.scrL.replace('{n}',tx[pk].who);$('scrB').innerHTML=tx[pk].scr.map(x=>'<div>'+x+'</div>').join('');};
  $('pact').className='pact'+(act?'':' auto');
  $('pwho').innerHTML=act?'<svg viewBox="-11 -11 22 22" aria-hidden="true"><g fill="#fff" opacity=".95"><path d="M0 -6.2a3.2 3.2 0 1 0 .01 0zM-6.2 6.6c.6-4 3-5.6 6.2-5.6s5.6 1.6 6.2 5.6z"/></g></svg>'+d.n[cur.by][5]:'⚙';
  $('pdo').textContent=act||t.ui.autoL;
  if(d.note)s+='<text class="nt" text-anchor="middle" x="280" y="'+(d.h-10)+'">'+t.ui.notes[d.note]+'</text>';
  $('pdiag').innerHTML=s+'</svg>';
  const setSt=st=>st.forEach((v,ni)=>{$('ps'+ni).textContent=v;});
  const done=()=>{showScr();setSt(cur.st);cur.m.forEach(m=>$('pn'+m[1]).classList.add('got'));(cur.hl||[]).forEach(i=>$('pn'+i).classList.add('got'));};
  const run=++pRun;
  if(!anim||reduce()||!runs.length)done();
  else{
    setSt(prev);if(act||!pk)showScr();
    const NS='http://www.w3.org/2000/svg',svg=$('pdiag').firstChild;
    const pills=runs.map(r=>{const g=document.createElementNS(NS,'g'),rc=document.createElementNS(NS,'rect'),tt=document.createElementNS(NS,'text');
      g.setAttribute('class','pill');tt.textContent=r[4]||'●';tt.setAttribute('text-anchor','middle');tt.setAttribute('y',4.5);g.appendChild(rc);g.appendChild(tt);svg.appendChild(g);
      let w=30;try{w=Math.max(30,tt.getComputedTextLength()+18);}catch(e){}
      rc.setAttribute('x',-w/2);rc.setAttribute('y',-11.5);rc.setAttribute('width',w);rc.setAttribute('height',23);rc.setAttribute('rx',11.5);return g;});
    const t0=performance.now()+(act?700:0),D=1400;
    const fr=now=>{if(run!==pRun)return;const u=Math.max(0,Math.min(1,(now-t0)/D)),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      pills.forEach((g,j)=>{const r=runs[j];g.setAttribute('transform','translate('+f(r[0]+(r[2]-r[0])*e)+','+f(r[1]+(r[3]-r[1])*e)+')');});
      if(u<1)requestAnimationFrame(fr);else{pills.forEach(g=>g.remove());done();}};
    fr(t0);
  }
  $('pseq').innerHTML=tx.map((x,i)=>'<li><button data-i="'+i+'" class="'+(i===pk?'now':i>pk?'todo':'')+'"><b>'+(i+1)+'</b><span>'+(x.a?'<span class="ha">👤 '+x.a+'</span>':'')+x.t+'</span></button></li>').join('');
  $('pseq').querySelectorAll('button').forEach(b=>b.onclick=()=>{pstop();pk=+b.dataset.i;drawProto(true);});
  $('pback').disabled=pk===0;$('pnext').disabled=pk===d.s.length-1;$('pplay').textContent=ptimer?t.ui.pause:t.ui.play;
}
function pstop(){if(ptimer){clearInterval(ptimer);ptimer=null;}$('pplay').textContent=T().ui.play;}
$('pback').onclick=()=>{pstop();pk--;drawProto(true);};
$('pnext').onclick=()=>{pstop();pk++;drawProto(true);};
$('pplay').onclick=()=>{if(ptimer){pstop();return;}const n=PD[proto].s.length;if(pk>=n-1)pk=-1;
  const step=()=>{if(pk>=PD[proto].s.length-1){pstop();return;}pk++;drawProto(true);};
  ptimer=setInterval(step,4200);step();};

/* practice block: tips, sample questions, pitfalls, MCQs */
const ans={};
function drawExam(){
  const e=T().exam,L='ABCD';
  $('exH').textContent=e.h;$('exTipsH').textContent=e.tipsH;$('exQH').textContent=e.qH;$('exPitH').textContent=e.pitH;$('exMcqH').textContent=e.mcqH;
  $('exTips').innerHTML=e.tips.map(x=>'<li>'+x+'</li>').join('');
  $('exQs').innerHTML=e.qs.map((q,i)=>'<div class="exq"><p><b>Q'+(i+1)+'</b> '+q.q+' <span class="mk">['+q.m+' '+e.marks+']</span></p><p class="al">'+e.ansL+'</p><ul>'+q.a.map(a=>'<li>'+a+'</li>').join('')+'</ul></div>').join('');
  $('exPits').innerHTML=e.pits.map(p=>'<li><span class="bad">✗ '+p.x+'</span><span class="good">✓ '+p.o+'</span></li>').join('');
  $('exMcq').innerHTML=e.mcq.map((q,i)=>{const a=ans[i],open=a===undefined;
    return '<div class="mq"><p><b>'+(i+1)+'.</b> '+q.q+'</p><div class="mo">'+q.o.map((o,j)=>'<button data-q="'+i+'" data-j="'+j+'" class="'+(open?'':j===q.c?'ok':j===a?'no':'')+'"'+(open?'':' disabled')+'><b>'+L[j]+'</b>'+o+'</button>').join('')+'</div>'+
      (open?'':'<p class="mw '+(a===q.c?'ok':'no')+'">'+(a===q.c?'✓ ':'✗ → '+L[q.c]+' · ')+q.w+'</p>')+'</div>';}).join('');
  $('exMcq').querySelectorAll('button').forEach(b=>b.onclick=()=>{ans[+b.dataset.q]=+b.dataset.j;drawExam();});
  const done=Object.keys(ans).length,ok=Object.keys(ans).filter(i=>ans[i]===e.mcq[i].c).length;
  $('exScore').textContent=done?e.scoreL+': '+ok+' / '+e.mcq.length:'';
}

function stop(){if(timer){clearInterval(timer);timer=null;}$('play').textContent=T().ui.play;}
$('back').onclick=()=>{stop();go(k-1,true);};
$('next').onclick=()=>{stop();go(k+1,true);};
$('restart').onclick=()=>{stop();go(0,true);};
$('play').onclick=()=>{if(timer){stop();return;}if(k>=STEPS.length-1)go(0,false);timer=setInterval(()=>{if(k>=STEPS.length-1){stop();return;}go(k+1,true);},3200);$('play').textContent=T().ui.pause;};

const h=location.hash.slice(1);if(TX[h])lang=h;
staticText();go(0,false);
