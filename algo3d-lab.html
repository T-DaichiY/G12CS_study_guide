<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algo 3D Lab</title>
<style>
:root{
  --bg:#F7F9FC; --panel:#FFFFFF; --ink:#22304A; --muted:#5B6B86; --line:#DCE4F0; --accent:#3B6FD4; --accent-soft:#E6EEFC;
  --hl:#FFF1C9; --hl-edge:#E0A020; --err:#C2414D; --err-soft:#FCE6E8;
  --idle:#A9CCEA; --cmp:#F6C667; --swap:#F29E8E; --sorted:#9ED9B8; --part:#CDEBDC; --pivot:#C3A6E8; --key:#B7D3A8; --dim:#DDE3EC;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Thai","PingFang SC","Hiragino Sans",sans-serif}
button,input,select{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px 16px 6px}
.brand h1{margin:0;font-size:21px;letter-spacing:.2px}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 13px;cursor:pointer;line-height:1.3}
.seg button:hover{border-color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#tabs button{font-weight:600;padding:6px 16px}
#langs{margin-left:auto}
.subbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:6px 16px 10px}
.grp{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.glabel{font-size:12.5px;color:var(--muted)}
.subbar input[type=text],.subbar input[type=number]{width:6.5rem;border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:#fff}
.subbar .opbtn,.subbar .tool{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 13px;cursor:pointer;font-weight:600}
.subbar .opbtn.main{background:var(--accent-soft);border-color:#B8CDF3}
.subbar .opbtn:hover:not(:disabled),.subbar .tool:hover:not(:disabled){border-color:var(--accent)}
.subbar button:disabled{opacity:.45;cursor:not-allowed}
.subbar label.chk{display:flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;grid-template-areas:"stage side" "msg side" "player side";gap:12px;padding:0 16px 28px;align-items:start}
.stage{grid-area:stage;position:relative;height:clamp(340px,58vh,640px);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.views{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.views button{border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.views button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.legend{position:absolute;left:10px;right:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.85);border-radius:999px;padding:1px 8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(34,48,74,.25)}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);background:var(--panel)}
.nogl[hidden]{display:none}
.msg{grid-area:msg;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.msgtxt{margin:0;font-size:17px;font-weight:600;min-height:3.1em}
.msgtxt.err{color:var(--err)}
.note{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.player{grid-area:player;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.plbtns{display:flex;gap:6px}
.pb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:600;min-width:3rem}
.pb.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:5.6rem}
.pb:hover:not(:disabled){border-color:var(--accent)}
.pb:disabled{opacity:.4;cursor:not-allowed}
.spd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.spd b{color:var(--ink);min-width:2.6em}
.scrub{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:200px}
.scrub input{flex:1}
#stepno{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:5.5em;text-align:right}
.side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-width:0}
.code{font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0;max-height:min(60vh,560px);overflow:auto}
.code .ln{white-space:pre;padding:0 12px;border-left:4px solid transparent;min-height:1.6em}
.code .ln.hl{background:var(--hl);border-left-color:var(--hl-edge)}
.watch{display:flex;flex-wrap:wrap;gap:6px}
.watch .v{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px 10px;font:13px ui-monospace,Menlo,Consolas,monospace}
.watch .v b{color:var(--accent)}
.watch .t{font-size:12.5px;color:var(--muted);width:100%}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats .s{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-size:13.5px}
.stats .s b{font-variant-numeric:tabular-nums;font-size:16px}
.race table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
.race th,.race td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line)}
.race th:first-child,.race td:first-child{text-align:left}
.race th{background:var(--accent-soft);font-weight:600}
.race tr.done td{background:#EEF9F3}
.race caption{caption-side:top;text-align:left;font-weight:600;padding:0 0 6px}
.race td.rk{font-weight:700}
@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "msg" "player" "side"}
  .stage{height:46vh;min-height:300px}
  #langs{margin-left:0}
  .msgtxt{font-size:16px}
  .code{max-height:50vh}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
:focus-visible{outline:3px solid #8FB2F0;outline-offset:2px}

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><h1 id="ttl">Algo 3D Lab</h1><p id="sub"></p></div>
    <nav id="tabs" class="seg" role="tablist" aria-label="Topic"></nav>
    <div id="langs" class="seg" aria-label="Language"></div>
  </header>
  <div id="subbar" class="subbar"></div>
  <main class="grid">
    <section class="stage" id="stage">
      <canvas id="cv" aria-label="3D view"></canvas>
      <div class="views" id="views"></div>
      <div class="legend" id="legend"></div>
      <div class="nogl" id="nogl" hidden></div>
    </section>
    <section class="msg" id="msg" aria-live="polite">
      <p id="msgtxt" class="msgtxt"></p>
      <p id="note" class="note"></p>
    </section>
    <section class="player" id="player">
      <div class="plbtns">
        <button type="button" id="bFirst" class="pb"></button>
        <button type="button" id="bPrev" class="pb"></button>
        <button type="button" id="bPlay" class="pb primary"></button>
        <button type="button" id="bNext" class="pb"></button>
      </div>
      <label class="spd"><span id="spdL"></span><input type="range" id="spd" min="0" max="5" step="1" value="2"><b id="spdV">1×</b></label>
      <div class="scrub"><input type="range" id="scrub" min="0" max="0" value="0" aria-label="Step"><span id="stepno">0 / 0</span></div>
    </section>
    <aside class="side">
      <div class="seg" id="codeseg"></div>
      <div class="code" id="code" tabindex="0"></div>
      <div class="watch" id="watch"></div>
      <div class="stats" id="stats"></div>
      <div class="race" id="race"></div>
    </aside>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        S.algo = a; if (a === 'race' && S.n < 16) S.n = 16; if (a !== 'race' && S.n > 16 && false) S.n = 8; renderSubbar(); renderHeader(); build(); })));
      sb.appendChild(grp(tr('ui.data'), seg([['random', tr('data.random')], ['nearly', tr('data.nearly')], ['reversed', tr('data.reversed')], ['few', tr('data.few')]], S.dkind, function (k) { S.dkind = k; renderSubbar(); build(); })));
      sb.appendChild(grp(tr('ui.n'), seg((S.algo === 'race' ? [16, 32] : [8, 16, 32]).map(function (n) { return [n, String(n)]; }), S.n, function (n) { S.n = n; renderSubbar(); build(); })));
      sb.appendChild(el('button', { type: 'button', class: 'tool', text: '🔀 ' + tr('ui.shuffle'), on: { click: function () { S.seed = (S.seed * 7 + 13) % 9973; build(); } } }));
      return;
    }
    var kind = S.tab, op = function (name, label, main) { return el('button', { type: 'button', class: 'opbtn' + (main ? ' main' : ''), 'data-op': name, text: label, on: { click: function () { doOp(name); } } }); };
    if (kind === 'queue') sb.appendChild(grp('', seg([['circular', tr('mode.circular')], ['linear', tr('mode.linear')]], S.qmode, function (m) { S.qmode = m; renderSubbar(); build(); })));
    if (kind === 'list') sb.appendChild(grp(tr('ui.model'), seg([['table', tr('mode.table')], ['node', tr('mode.node')]], S.lview, function (m) {
      S.lview = m; if (view && view.setMode) { view.setMode(m); view.apply(curStep, true, player.dur()); } renderSubbar(); applyCamera(true); writeHash(); })));
    var vi = el('input', { type: 'text', id: 'valin', maxlength: kind === 'list' ? '3' : '4', placeholder: placeholder(), 'aria-label': tr('ui.value'), inputmode: kind === 'list' ? 'numeric' : 'text', autocomplete: 'off',
      on: { keydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); var b = document.querySelector('.opbtn.main'); if (b && !b.disabled) b.click(); } } } });
    vi.value = S.val || '';
    sb.appendChild(grp(tr('ui.value'), vi));
    var ops = kind === 'stack' ? [['push', 1], ['pop'], ['peek']] : kind === 'queue' ? [['enqueue', 1], ['dequeue']] : [['insert', 1], ['delete'], ['search']];
    var og = el('div', { class: 'grp' });
    ops.forEach(function (o) { og.appendChild(op(o[0], tr('op.' + o[0]), o[1])); });
    sb.appendChild(og);
    var chk = el('input', { type: 'checkbox', id: 'stepchk', on: { change: function (e) { S.stepMode = e.target.checked; } } }); chk.checked = S.stepMode;
    sb.appendChild(el('label', { class: 'chk' }, [chk, el('span', { text: tr('ui.stepmode') })]));
    sb.appendChild(el('button', { type: 'button', class: 'tool', text: '↺ ' + tr('ui.reset'), on: { click: resetDS } }));
    sb.appendChild(el('button', { type: 'button', class: 'tool', text: '▶▶ ' + tr('ui.demo'), on: { click: function () { loadDemo(true); } } }));
    updateControls();
  }
  function placeholder() {
    if (S.tab === 'list') return String(LISTSEQ[(S.letter.list || 0) % LISTSEQ.length]);
    var k = dsKey(); return String.fromCharCode(65 + ((S.letter[k] || 0) % 26));
  }

  function renderLegend() {
    var lg = $('legend'); lg.innerHTML = '';
    if (S.tab !== 'sort') return;
    var items = [['cmp', 'legend.cmp'], ['swap', 'legend.swap']];
    if (S.algo === 'insertion') items.push(['key', 'legend.key'], ['part', 'legend.part']);
    if (S.algo === 'quick') items.push(['pivot', 'legend.pivot'], ['dim', 'legend.dim']);
    if (S.algo === 'merge') items.push(['part', 'legend.part'], ['dim', 'legend.dim']);
    if (S.algo === 'race') items.push(['part', 'legend.part'], ['pivot', 'legend.pivot']);
    items.push(['sorted', 'legend.sorted']);
    var col = { cmp: '#F6C667', swap: '#F29E8E', key: '#B7D3A8', part: '#BDE6D0', pivot: '#C3A6E8', dim: '#DDE3EC', sorted: '#86D3A8' };
    items.forEach(function (it) { lg.appendChild(el('span', {}, [el('i', { style: 'background:' + col[it[0]] }), document.createTextNode(tr(it[1]))])); });
  }

  function noteText() {
    if (S.tab === 'sort') return S.algo === 'race' ? tr('note.race') : tr('note.a.' + S.algo) + ((S.algo === 'quick' || S.algo === 'merge') ? ' ' + tr('note.inplace') : '');
    if (S.tab === 'queue') return tr(S.qmode === 'linear' ? 'note.queue.l' : 'note.queue.c');
    return tr('note.' + S.tab);
  }
  function renderMsg() {
    var m = $('msgtxt');
    if (!curStep) { m.textContent = ''; return; }
    m.textContent = A.t(S.lang, curStep.msg[0], curStep.msg.slice(1), base());
    m.className = 'msgtxt' + (curStep.marks && curStep.marks.error ? ' err' : '');
    $('note').textContent = noteText();
  }

  /* ---------------------------------------------------------------- code panel */
  var codeBuilt = '';
  function renderCode() {
    var id = codeId(), box = $('code'), race = S.algo === 'race' && S.tab === 'sort';
    $('code').style.display = $('watch').style.display = $('codeseg').style.display = race ? 'none' : '';
    $('race').style.display = race ? '' : 'none';
    $('stats').style.display = (S.tab === 'sort' && !race) ? '' : 'none';
    if (race) { codeBuilt = ''; return; }
    var sig = id + '/' + S.code;
    if (codeBuilt !== sig) {
      codeBuilt = sig; box.innerHTML = '';
      A.CODE[id][S.code].forEach(function (l, i) {
        var d = el('div', { class: 'ln', 'data-k': l[0] }); d.textContent = l[1] === '' ? ' ' : l[1]; box.appendChild(d);
      });
      box.scrollTop = 0;
    }
    hiliteCode();
  }
  function hiliteCode() {
    var box = $('code'), key = curStep ? curStep.line : '', first = null;
    Array.prototype.forEach.call(box.children, function (d) {
      var on = key !== '' && d.getAttribute('data-k') === key;
      d.classList.toggle('hl', on);
      if (on && !first) first = d;
    });
    if (first) {
      var top = first.offsetTop - box.offsetTop, bot = top + first.offsetHeight;
      if (top < box.scrollTop + 8) box.scrollTop = Math.max(0, top - 40);
      else if (bot > box.scrollTop + box.clientHeight - 8) box.scrollTop = bot - box.clientHeight + 60;
    }
  }
  function renderWatch() {
    var w = $('watch'); w.innerHTML = '';
    if (S.algo === 'race' && S.tab === 'sort') return;
    var v = (curStep && curStep.vars) || {}, names = Object.keys(v), b = base(), pseudo = S.code === 'pseudo';
    if (S.tab === 'sort') names.sort(function (x, y) { var a = SORT_ORDER.indexOf(x), c = SORT_ORDER.indexOf(y); return (a < 0 ? 99 : a) - (c < 0 ? 99 : c); });
    if (!names.length) return;
    w.appendChild(el('div', { class: 't', text: tr('ui.watch') }));
    names.forEach(function (n) {
      var val = v[n];
      if (S.tab === 'sort' && A.INDEX_VARS.indexOf(n) >= 0) val = val + b;
      if (A.BOOL_VARS.indexOf(n) >= 0) val = val ? (pseudo ? 'TRUE' : 'True') : (pseudo ? 'FALSE' : 'False');
      var label = pseudo ? (A.PSEUDO_NAMES[n] || n.charAt(0).toUpperCase() + n.slice(1)) : n;
      w.appendChild(el('span', { class: 'v' }, [el('b', { text: label }), document.createTextNode(' = ' + val)]));
    });
  }
  function renderStats() {
    var s = $('stats'); s.innerHTML = '';
    if (S.tab !== 'sort' || S.algo === 'race' || !curStep) return;
    s.appendChild(el('span', { class: 's' }, [document.createTextNode(tr('stats.cmp') + ' '), el('b', { text: curStep.stats.cmp })]));
    s.appendChild(el('span', { class: 's' }, [document.createTextNode(tr('stats.writes') + ' '), el('b', { text: curStep.stats.moves })]));
  }
  function renderRace() {
    var r = $('race'); r.innerHTML = '';
    if (!(S.algo === 'race' && S.tab === 'sort') || !curStep || !raceInfo) return;
    var t = el('table'), names = { bubble: 'algo.bubble', insertion: 'algo.insertion', quick: 'algo.quick', merge: 'algo.merge' };
    t.appendChild(el('caption', { text: tr('race.title') }));
    var hr = el('tr'); ['race.algo', 'stats.cmp', 'stats.writes', 'race.ticks', 'race.rank'].forEach(function (k) { hr.appendChild(el('th', { text: tr(k) })); });
    t.appendChild(hr);
    curStep.lanes.forEach(function (l, i) {
      var info = raceInfo[i], tr_ = el('tr', { class: l.done ? 'done' : '' });
      tr_.appendChild(el('td', { text: tr(names[info.algo]) }));
      tr_.appendChild(el('td', { text: l.cmp })); tr_.appendChild(el('td', { text: l.moves }));
      tr_.appendChild(el('td', { text: l.done ? info.ticks : tr('race.running') }));
      tr_.appendChild(el('td', { class: 'rk', text: l.done ? '✓ #' + info.rank : '' }));
      t.appendChild(tr_);
    });
    r.appendChild(t);
  }

  /* ---------------------------------------------------------------- controls */
  function updateControls() {
    var n = player.steps.length, last = Math.max(0, n - 1);
    var sc = $('scrub'); sc.max = last; sc.value = player.idx;
    $('stepno').textContent = player.idx + ' / ' + last;
    $('bPlay').textContent = player.playing ? '⏸ ' + tr('ui.pause') : '▶ ' + tr('ui.play');
    $('bFirst').disabled = $('bPrev').disabled = player.idx <= 0;
    $('bNext').disabled = player.idx >= last;
    var dis = player.playing;
    Array.prototype.forEach.call(document.querySelectorAll('.subbar .opbtn'), function (b) { b.disabled = dis; });
  }
  function applyCamera(animate) {
    if (!stage || !stage.ok || !view) return;
    var v;
    if (S.tab === 'sort') v = view.views[S.cam];
    else if (S.tab === 'list') { v = A.DS_VIEWS['list_' + S.lview][S.cam]; if (S.lview === 'node' && view.needW) { v = { dir: v.dir, target: v.target, need: [view.needW(), v.need[1]] }; lastNeedW = v.need[0]; } }
    else v = A.DS_VIEWS[dsKey()][S.cam];
    stage.setView(v, animate);
  }

  function onStep(step, idx, animate) {
    curStep = step;
    if (view) {
      var ms = animate ? player.dur() : 0;
      if (S.tab === 'sort') { if (S.algo === 'race') view.applyRace(step, animate, ms, raceInfo); else view.applySingle(step, animate, ms); }
      else view.apply(step, animate, ms);
      if (S.tab === 'list' && S.lview === 'node' && view.needW && view.needW() !== lastNeedW) applyCamera(animate);
    }
    renderMsg(); renderCode(); renderWatch(); renderStats(); renderRace(); writeHash();
  }
  player.cb = onStep; player.onState = updateControls;

  /* ---------------------------------------------------------------- build / switch */
  function build(startIdx) {
    player.pause();
    codeBuilt = '';
    renderLegend();
    if (S.tab === 'sort') {
      var vals = A.makeData(S.dkind, S.n, S.seed), race = S.algo === 'race';
      if (stage.ok) { view = new A.SortView(stage, race ? 'race' : 'single', vals); view.setBase(base()); applyCamera(false); }
      var steps;
      if (race) { var rd = A.raceSteps(vals); raceInfo = rd.lanes; steps = rd.steps; }
      else { raceInfo = null; steps = A.sortSteps(S.algo, vals); }
      player.noRestart = false;
      player.load(steps, startIdx || 0);
    } else {
      var key = dsKey();
      if (!H[key]) {
        var st = A.dsInit(S.tab, { mode: S.qmode });
        H[key] = { state: st, steps: [A.dsInitStep(S.tab, st)] };
      }
      if (stage.ok) {
        view = S.tab === 'stack' ? new A.StackView(stage) : S.tab === 'queue' ? new A.QueueView(stage, S.qmode) : new A.ListView(stage, S.lview);
        applyCamera(false);
      }
      raceInfo = null; player.noRestart = true;
      player.load(H[key].steps, startIdx != null ? startIdx : H[key].steps.length - 1);
    }
    $('msg').hidden = false;
  }
  function setTab(t) { if (t === S.tab) return; S.tab = t; renderHeader(); renderSubbar(); build(); }
  function setLang(l) {
    S.lang = l; renderHeader(); renderSubbar(); renderLegend();
    if (curStep) { renderMsg(); renderWatch(); renderStats(); renderRace(); }
    writeHash();
  }
  function setCode(c) {
    S.code = c; renderHeader();
    if (view && view.setBase) view.setBase(base());
    codeBuilt = ''; renderCode(); renderMsg(); renderWatch();
  }

  /* ---------------------------------------------------------------- data-structure operations */
  function nextValue(kind) {
    var raw = ($('valin') ? $('valin').value : '').trim();
    if (kind === 'list') {
      var n = parseInt(raw, 10);
      if (isNaN(n)) { n = LISTSEQ[(S.letter.list || 0) % LISTSEQ.length]; S.letter.list = (S.letter.list || 0) + 1; }
      return n;
    }
    if (raw) return raw;
    var k = dsKey(), c = S.letter[k] || 0; S.letter[k] = c + 1;
    return String.fromCharCode(65 + (c % 26));
  }
  function doOp(op) {
    if (player.playing || S.tab === 'sort') return;
    var kind = S.tab, h = H[dsKey()], arg;
    if (op === 'push' || op === 'enqueue' || op === 'insert') arg = nextValue(kind);
    else if (op === 'delete' || op === 'search') {
      var raw = ($('valin') ? $('valin').value : '').trim(), n = parseInt(raw, 10);
      if (isNaN(n)) { var ch = A.listChains(h.state); n = ch.used.length ? h.state.data[ch.used[0]].v : 10; }
      arg = n;
    }
    if ($('valin') && (op === 'push' || op === 'enqueue' || op === 'insert' || op === 'delete' || op === 'search')) { $('valin').value = ''; S.val = ''; $('valin').placeholder = placeholder(); }
    if (player.idx < h.steps.length - 1) player.seek(h.steps.length - 1);
    var r = A.dsSteps(kind, h.state, op, arg);
    h.state = r.state;
    player.append(r.steps);
    player.noRestart = true;
    player.next();
    if (!S.stepMode) player.play();
  }
  function resetDS() {
    if (S.tab === 'sort') return;
    delete H[dsKey()]; S.letter[dsKey()] = 0; if (S.tab === 'list') S.letter.list = 0;
    build(); renderSubbar();
  }
  function loadDemo(autoplay, seekTo) {
    var kind = S.tab, key = dsKey();
    if (kind === 'sort') return;
    var st = A.dsInit(kind, { mode: S.qmode }), steps = [A.dsInitStep(kind, st)];
    var seq = kind === 'queue' ? A.DEMO['queue_' + S.qmode] : A.DEMO[kind];
    seq.forEach(function (o) { var r = A.dsSteps(kind, st, o[0], o[1]); st = r.state; r.steps.forEach(function (s) { steps.push(s); }); });
    H[key] = { state: st, steps: steps };
    S.letter[key] = 0; if (kind === 'list') S.letter.list = 0;

    if (seekTo != null) { player.seek(Math.min(seekTo, steps.length - 1)); return; }
    if (autoplay) { player.noRestart = false; player.play(); player.noRestart = true; }
  }

  /* ---------------------------------------------------------------- init */
  function init() {
    var hs = parseHash();
    renderHeader(); renderSubbar();
    var cv = $('cv');
    stage = new A.Stage(cv);
    if (!stage.ok) { $('nogl').hidden = false; $('nogl').textContent = tr('ui.nowebgl'); cv.style.display = 'none'; }

    $('bNext').addEventListener('click', function () { player.pause(); player.next(); });
    $('bPrev').addEventListener('click', function () { player.pause(); player.prev(); });
    $('bFirst').addEventListener('click', function () { player.pause(); player.seek(0); });
    $('spd').addEventListener('input', function (e) { var s = SPEEDS[+e.target.value]; player.setSpeed(s); $('spdV').textContent = s + '×'; });

    document.addEventListener('keydown', function (e) {
      var t = e.target && e.target.tagName;

      else if (e.key === 'ArrowLeft') { player.pause(); player.prev(); }
      else if (e.key === 'Home') { player.pause(); player.seek(0); }

    else build(hs.start);

  }

})();
