<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ページとセグメントのラボ / Memory Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&family=Prompt:wght@600;700&family=Sarabun:wght@400;700&display=swap">
<style>
/* Layout: same lab notebook as the Interrupt Lab. Color = which program owns the block. Red is reserved for faults and warnings. */
:root{
  --bg:#F4F5F7; --panel:#FFFFFF; --ink:#141A22; --muted:#56606C; --line:#D5DAE1; --soft:#ECEEF2;
  --sheet:#1F55D0; --on-sheet:#FFFFFF; --word:#13793A; --on-word:#FFFFFF; --game:#E3A81C; --on-game:#141A22;
  --browser:#B8561F; --on-browser:#FFFFFF; --os:#6F2450; --on-os:#FFFFFF;
  --pa:#5A6472; --on-pa:#FFFFFF; --sig:#E0201B; --sig-soft:#FCE3E0; --ok:#13793A; --ok-soft:#DCF2E4; --disk:#DCE7F5; --disk-top:#BFD3EC;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1318; --panel:#181E26; --ink:#EEF1F5; --muted:#A2ACB8; --line:#2E3742; --soft:#222A34;
  --sheet:#8AB0FF; --on-sheet:#0F1318; --word:#6BD893; --on-word:#0F1318; --game:#F0C24B; --on-game:#0F1318;
  --browser:#F09A62; --on-browser:#0F1318; --os:#D58BB4; --on-os:#0F1318;
  --pa:#B4BDC8; --on-pa:#0F1318; --sig:#FF5A52; --sig-soft:#401A17; --ok:#6BD893; --ok-soft:#14351F; --disk:#1C2B3E; --disk-top:#2A4059; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1318; --panel:#181E26; --ink:#EEF1F5; --muted:#A2ACB8; --line:#2E3742; --soft:#222A34;
  --sheet:#8AB0FF; --on-sheet:#0F1318; --word:#6BD893; --on-word:#0F1318; --game:#F0C24B; --on-game:#0F1318;
  --browser:#F09A62; --on-browser:#0F1318; --os:#D58BB4; --on-os:#0F1318;
  --pa:#B4BDC8; --on-pa:#0F1318; --sig:#FF5A52; --sig-soft:#401A17; --ok:#6BD893; --ok-soft:#14351F; --disk:#1C2B3E; --disk-top:#2A4059; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body.v-ja{--f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;--f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.75}
body.v-zh{--f-display:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.75}
body.v-th{--f-display:"Prompt","Noto Sans Thai",sans-serif;--f-body:"Sarabun","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;line-height:1.8;font-size:17px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:clamp(30px,5.2vw,52px);font-weight:800;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--sheet)}
h2{font-size:clamp(22px,3vw,30px);font-weight:800}
h3{font-size:17px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
section{margin-top:56px;display:flex;flex-direction:column;gap:18px}
header{padding-top:40px;display:flex;flex-direction:column;gap:14px}
.lead{color:var(--muted);max-width:68ch}
button:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.c-sheet{--c:var(--sheet);--on:var(--on-sheet)} .c-word{--c:var(--word);--on:var(--on-word)} .c-game{--c:var(--game);--on:var(--on-game)}
.c-pa{--c:var(--pa);--on:var(--on-pa)} .c-browser{--c:var(--browser);--on:var(--on-browser)} .c-os{--c:var(--os);--on:var(--on-os)}

.langbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.langin{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--panel);gap:4px;flex-wrap:wrap}
.seg .cap{font-size:12px;color:var(--muted);padding:0 6px;align-self:center}
.seg button{appearance:none;font:inherit;font-size:14px;font-weight:700;border:0;border-radius:9px;padding:7px 14px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.langin .seg button{font-family:"Atkinson Hyperlegible","Zen Kaku Gothic New","Noto Sans SC","Sarabun",system-ui,sans-serif}

.track{display:flex;flex-wrap:wrap;gap:6px}
.tstep{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px;line-height:1.3;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.tstep b{font-family:var(--f-mono);font-size:12px}
.tstep:hover{border-color:var(--ink)}
.tstep.done{color:var(--ink)}
.tstep.now{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.bench{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px}
.now-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:14px;min-height:150px;align-content:start}
.figtag{font-family:var(--f-mono);font-size:13px;font-weight:600;padding:5px 12px;border-radius:8px;background:var(--ink);color:var(--bg);white-space:nowrap}
.figtag.extra{background:transparent;color:var(--ink);border:2px dashed var(--ink)}
.now-card h3{font-size:22px;font-weight:800}
.now-card .en{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:2px}
.now-card .desc{margin-top:6px;max-width:74ch;font-size:16.5px}

/* The stage mirrors the classroom diagram: programs, logical memory, page table, physical memory, swap. */
.stage{position:relative;display:grid;gap:12px;align-items:stretch;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1.05fr) minmax(0,2.7fr) minmax(0,1.05fr);
  grid-template-areas:"cpu cpu cpu cpu" "files log ram swap"}
.stage.noswap{grid-template-columns:minmax(0,1.05fr) minmax(0,1.05fr) minmax(0,3.8fr);grid-template-areas:"cpu cpu cpu" "files log ram"}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}
#ov path{fill:none;stroke:var(--ink);stroke-width:2}
#ov .head{fill:var(--ink);stroke:none}
.zone{border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:box-shadow .3s}
.zone.hot{box-shadow:0 0 0 3px var(--ink)}
.ztag{display:inline-block;align-self:flex-start;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 8px;border-radius:5px;background:var(--ink);color:var(--bg);line-height:1.6}
.ztag.ghost{background:transparent;color:var(--ink);border:1px dashed var(--ink)}
.ztit{font-weight:700;font-size:15px;line-height:1.3}
.zsub{font-size:12px;color:var(--muted);line-height:1.4}
.zstore{background:var(--disk);border:1px solid var(--line)}
.zram{border:2px dashed var(--muted);background:var(--soft)}
.zlog{border:2px dotted var(--muted);background:transparent}
.zcpu{grid-area:cpu;border:3px solid var(--ink);flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 14px}
.zfiles{grid-area:files}.zlogi{grid-area:log}.zr{grid-area:ram}.zswap{grid-area:swap}

.cpuhead{display:flex;flex-direction:column;gap:2px;flex:0 1 170px;min-width:120px}
.cpuflow{flex:1 1 420px;display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;min-width:0}
.ab{flex:1 1 150px;min-width:0;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:1px;animation:fin .4s both}
.ab .l{font-size:12px;color:var(--muted);line-height:1.35}
.ab .v{font-family:var(--f-mono);font-weight:600;font-size:16px;line-height:1.35;font-variant-numeric:tabular-nums}
.ab .x{font-family:var(--f-mono);font-size:11px;color:var(--muted);line-height:1.4}
.ab.bad{border-color:var(--sig);background:var(--sig-soft)}
.ab.bad .v{color:var(--sig)}
.ab.good{border-color:var(--ok);background:var(--ok-soft)}
.fa{align-self:center;font-weight:900;font-size:18px;color:var(--muted)}
.idle{font-size:13px;color:var(--muted);align-self:center}
.meter{flex:1 1 280px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mbar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.mbar i{display:block;height:100%}
.mbar .work{width:12%;background:var(--word)}
.mbar .swapb{width:88%;background:repeating-linear-gradient(45deg,var(--sig) 0 6px,var(--sig-soft) 6px 12px)}
@keyframes fin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

.files{display:flex;flex-direction:column;gap:6px}
.file{appearance:none;font:inherit;text-align:left;border:1px solid var(--line);border-left:7px solid var(--c);border-radius:8px;background:var(--panel);color:var(--ink);padding:5px 8px;cursor:pointer;display:flex;flex-direction:column;gap:0;min-width:0}
.file:disabled{cursor:default}
.file:not(:disabled):hover{border-color:var(--ink);border-left-color:var(--c)}
.file .fn{font-weight:700;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.file .fx{font-family:var(--f-mono);font-size:11px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.file .fs{font-size:11px;color:var(--muted);line-height:1.35}
.file.open .fs{color:var(--ink);font-weight:700}
.file.view{box-shadow:0 0 0 2px var(--c)}
.file.want{animation:want 1.2s ease-in-out infinite}
@keyframes want{50%{box-shadow:0 0 0 4px var(--c)}}

.logwrap{display:flex;gap:0;flex:1;min-height:200px}
.edge{width:9px;flex:none;border:1px solid var(--muted);border-right:0;background:repeating-linear-gradient(0deg,var(--panel) 0 11px,var(--line) 11px 12px);position:relative;border-radius:4px 0 0 4px}
.edge::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:var(--c)}
.sheet{flex:1;min-width:0;border:1px solid var(--muted);background:var(--panel);display:flex;flex-direction:column;border-radius:0 4px 4px 0;padding:3px;gap:2px}
.lemp{font-size:12px;color:var(--muted);text-align:center;padding:16px 4px;line-height:1.4}
.cell{--h:24px;height:var(--h);display:flex;align-items:center;justify-content:center;gap:6px;background:var(--c);color:var(--on);font-family:var(--f-mono);font-size:12px;font-weight:600;border-radius:3px;line-height:1;min-width:0;overflow:hidden;white-space:nowrap}
.cell.tall{flex-direction:column;gap:1px;white-space:normal;text-align:center;font-size:11px;line-height:1.2}
.cell.out{background:var(--panel);color:var(--ink);outline:2px dashed var(--c);outline-offset:-2px}
.cell.part{background:linear-gradient(90deg,var(--c) 0 42%,transparent 42%),repeating-linear-gradient(45deg,var(--c) 0 2px,var(--panel) 2px 7px);outline:1px solid var(--c);outline-offset:-1px;color:var(--ink);justify-content:flex-start;padding-left:4px}
.cell.part span{color:var(--on)}
.cell.tall.one{flex-direction:row;gap:6px;font-size:10px;white-space:nowrap}
button.cell,.lcell{cursor:pointer}
.lcell:hover{filter:brightness(1.08)}
/* Every page, frame and segment in the simulator has a strong outline */
.sheet .cell,.slot .cell,.chips .cell{border:2px solid var(--ink)}
.sheet .cell.out{border-color:transparent}

.ramhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.free{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.free.zero{background:var(--sig);border-color:var(--sig);color:var(--panel)}
.raminner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px;min-width:0}
.tablebox{border-radius:10px;padding:8px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0;align-self:start;transition:box-shadow .3s}
.tablebox.hot,.physbox.hot{box-shadow:0 0 0 3px var(--ink)}
.tablebox .ztit{font-size:13px}
.ptb{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.ptb th{font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--muted);padding:2px 3px;text-align:left}
.ptb td{padding:3px;border-top:1px solid var(--line);white-space:nowrap}
.ptb td.k{font-weight:600;box-shadow:inset 4px 0 0 var(--c);padding-left:8px}
.ptb tr.hit td{background:var(--ink);color:var(--bg)}
.ptb tr.bad td{background:var(--sig);color:var(--panel)}
.ptb tr.off td{color:var(--muted)}
.physbox{border-radius:10px;padding:8px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0;transition:box-shadow .3s}
.physbox .ztit{font-size:13px}
.frames{display:flex;flex-direction:column;gap:2px}
.fr{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px;align-items:center}
.fr>i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
.slot{height:23px;border:1px solid var(--muted);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);min-width:0;background:var(--panel)}
.pulse .slot{animation:slotp 1.2s ease-in-out infinite;border-color:var(--ink)}
@keyframes slotp{50%{background:var(--soft)}}
.slot .cell{--h:21px;width:100%}
.segram{position:relative;height:400px;margin-left:34px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.sb{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sb .cell{--h:100%;width:100%;height:100%;border-radius:0;border:2px solid var(--ink)}
.hole{font-size:11px;color:var(--muted);font-family:var(--f-mono);background:repeating-linear-gradient(45deg,transparent 0 5px,var(--line) 5px 6px);height:100%;width:100%;display:flex;align-items:center;justify-content:center}
.hole.bad{outline:2px solid var(--sig);outline-offset:-2px;color:var(--sig);font-weight:600;background:repeating-linear-gradient(45deg,var(--sig-soft) 0 5px,transparent 5px 10px)}
.tick{position:absolute;left:-34px;width:30px;text-align:right;font-family:var(--f-mono);font-size:10px;color:var(--muted);line-height:1;transform:translateY(-1px)}
.cyl{position:relative;background:var(--disk-top);border:1px solid var(--muted);border-radius:50%/26px;padding:34px 8px 22px;min-height:230px;display:flex;flex-direction:column;gap:3px;flex:1}
.cyl::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:52px;border-radius:50%;background:var(--panel);border:1px solid var(--muted)}
.cyl>*{position:relative}
.swapfile{border:1px dashed var(--ink);border-radius:6px;background:var(--panel);padding:5px;display:flex;flex-direction:column;gap:3px;min-height:64px}
.swapfile .fx{font-family:var(--f-mono);font-size:11px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.chips{display:flex;flex-direction:column;gap:2px}
.sempty{font-size:11px;color:var(--muted);line-height:1.35}
.flyer{position:absolute;z-index:8;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--c);color:var(--on);font-family:var(--f-mono);font-size:12px;font-weight:600;border-radius:3px;box-shadow:0 10px 24px rgba(0,0,0,.28);pointer-events:none;overflow:hidden}

/* Fragmentation scenarios: one 100 MB memory column, 3.2 px per MB */
.frag{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1.1fr);grid-template-areas:"fb fb fb" "fl fm fr";align-items:start}
.fban{grid-area:fb;display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;min-width:0}
.fban>div:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.bnT{font-family:var(--f-display);font-size:clamp(20px,2.6vw,26px);font-weight:800;line-height:1.25}
.bnN{font-size:14px;font-weight:700;line-height:1.4}
.bnS{font-size:13px;line-height:1.45;opacity:.85}
.fglyph{flex:none;width:44px;height:52px;display:flex;flex-direction:column;gap:2px}
.fglyph i{display:block;background:var(--bg);border-radius:1px}
.fl{grid-area:fl}.fm{grid-area:fm}.fr2{grid-area:fr}
.fside{display:flex;flex-direction:column;gap:8px;min-width:0}
.fwait{display:flex;flex-direction:column;gap:6px;min-height:40px}
.fhd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.fhd b{font-size:14px}.fhd .ps{font-size:13px;font-weight:700;color:var(--sig)}
.fmem{box-sizing:content-box;position:relative;height:320px;margin-left:62px;background:var(--disk);border:2px solid var(--ink)}
.fp{height:var(--h);display:flex;align-items:center;justify-content:center;background:var(--c);color:var(--on);border-radius:8px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;line-height:1;min-width:0;position:relative}
.fmem>.fp,.fmem>.fhole{position:absolute;left:3px;right:3px}
.flab{position:absolute;left:-62px;width:56px;text-align:right;font-size:11px;color:var(--muted);line-height:1.2;font-family:var(--f-mono)}
.flab.pg{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--ink);transform:translateY(38px)}
.pgbox{position:absolute;left:0;right:0;margin:2px 3px;height:92px;border:3px solid var(--ink);border-radius:4px;background:var(--panel);display:flex;flex-direction:column;padding:2px;gap:2px}
.pgbox .fp{border-radius:3px}
.fmem>.fp{border:3px solid var(--ink);border-radius:4px}
.fmem.ext{margin-right:24px}
.fline{position:absolute;left:-62px;right:-24px;height:0;border-top:1px dashed var(--ink);transform:translateY(-.5px);z-index:1;pointer-events:none}
.fmk{position:absolute;left:-62px;width:56px;text-align:right;font-family:var(--f-mono);font-size:13px;font-weight:600;line-height:1;color:var(--ink);transform:translateY(calc(-100% - 3px))}
.fmk.first{transform:translateY(3px)}
.fkey i.dl{width:26px;height:0;border:0;border-top:1px dashed var(--ink);border-radius:0}
.fkey{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.fkey i{width:22px;height:14px;border:3px solid var(--ink);border-radius:3px;display:inline-block;flex:none}
.pgbox .fp{flex:var(--g) 0 0;height:auto}
.fhatch{flex:var(--g) 0 0;border:2px dashed var(--sig);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sig);background:repeating-linear-gradient(45deg,var(--sig-soft) 0 5px,var(--panel) 5px 10px)}
.pgfree{flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}

const ST={
en:{
p0:["Start","Programs wait on the disk","Program files · RAM","Programs are stored as files on the disk. The CPU can only run what is in RAM, so a program must be copied in first. At the start, RAM holds only the operating system."],
p1:["Pages","Open the spreadsheet: it becomes pages","Logical memory · Pages","The OS gives the program its own logical memory and divides it into pages. Every page is the same size, here 4 KiB. The program is cut by size, not by meaning."],
p2:["Frames","RAM is divided into frames","Physical memory · Frames","Physical memory is divided into frames. A frame is exactly the same size as a page, so any page fits in any frame."],
p3:["Load","Pages go into any free frames","Loading pages into frames","The pages are copied into free frames. They do not have to be next to each other. The program still sees its pages in order."],
p4:["Page table","The page table remembers where each page went","Page table · P flag","Each program has its own page table, and it is stored in RAM. The page number is the index: page 3 is in frame 9. P = 1 means the page is present in RAM."],
p5:["Translate","Logical address → physical address","MMU · Address translation","The program gives one address. The MMU splits it into a page number and an offset, finds the frame in the page table, and keeps the offset the same. The program never needs to know the frame number."],
p6:["Share","More programs share the RAM","Each process has its own table","The word processor and the game are opened. Each one gets its own logical memory and page table. Their pages fill the free frames, so RAM looks mixed, but each table keeps its pages in order."],
v0:["RAM full","The browser opens, but RAM is full","No free frames","All 16 frames are in use. Without virtual memory, the new program could not be loaded, and programs larger than RAM could not run at all."],
v1:["Swap file","Virtual memory adds space on the disk","Virtual memory = RAM + swap space","Part of the HDD or SSD is used as a swap file. Programs can now use more memory than the RAM has. The program does not know which of its pages are on the disk."],
v2:["Swap out","A page moves to the swap file","Swap out · P flag · D flag","The OS chooses G1, which has not been used for the longest time. It was changed in RAM (dirty, D = 1), so it is written to the swap file. In the table, its P flag becomes 0, and frame 5 is now free."],
v3:["Demand","The browser's first page loads","Demand paging","B0 goes into frame 5. B1 stays on the disk until it is needed. Loading a page only when it is needed is called demand paging."],
v4:["Page fault","The game needs G1 again","Page fault (interrupt)","The MMU reads the table and sees P = 0. This raises a page fault, which is a hardware interrupt. It is not a bug in the program. The OS must now bring G1 back into RAM."],
v5:["Replace","One page out, one page in","Page replacement","No frame is free, so the OS replaces a page. S5 has not been used for the longest time, so it goes to the swap file and G1 comes into frame 6. The table is updated, and the game continues."],
v6:["Thrashing","Too much swapping","Disk thrashing · Thrash point","If programs need more memory than RAM can hold, pages move in and out all the time. The disk is very busy and the CPU does little real work. At the thrash point, the programs almost stop. More RAM or fewer programs reduces this."],
i0:["Pages","Memory is cut into 30 MB pages","Memory 100 MB · Page size 30 MB","The memory has 100 MB and each page is 30 MB, so there are three pages. The last 10 MB is smaller than a page, so it cannot be used as one."],
i1:["Program A","Program A fits exactly","No waste","Program A is 30 MB, the same size as a page. Page 1 is completely full."],
i2:["Program B","Program B takes a whole page","Allocated in whole pages","Program B is only 10 MB, but memory is given in whole pages. It takes all of page 2, so 20 MB inside the page stays empty."],
i3:["Program C","The same happens with program C","Empty space inside the page","Program C is 20 MB, so 10 MB inside page 3 stays empty. Inside the pages, 30 MB is now empty."],
i4:["Program D","Program D cannot use the empty space","Internal fragmentation","Program D needs 20 MB, and page 2 has 20 MB empty. But page 2 belongs to program B, and no page is free. Empty space inside a page that others cannot use is called internal fragmentation."],
e0:["Full","Programs of different sizes fill the memory","Variable-size blocks","Here each program gets exactly the space it needs, in one continuous block, as with segments. There is no empty space inside a block. The memory is full."],
e1:["Finish","Programs B and D finish","Deallocation","Programs B and D finish, and the OS frees their memory."],
e2:["Holes","Two holes appear","Holes between blocks","There are now 20 MB free. But it is in two holes of 10 MB, with program C between them."],
e3:["Program F","Program F needs 20 MB","External fragmentation","Program F needs one continuous block of 20 MB. The total free space is 20 MB, but each hole is only 10 MB, so F does not fit. Free space split up between blocks is called external fragmentation. Paging avoids this, because any page fits any frame."],
s0:["Start","No equal blocks this time","Program file · RAM","With segmentation, physical memory is not cut into frames. Here it is one long range of addresses from 0 to 1600 KB, with the OS at the end."],
s1:["Segments","The program is split by meaning","Segments · Logical memory","The word processor is split into code, data and stack. Each part is a segment. The sizes are different because each part needs a different amount of memory. The programmer can see these parts."],
s2:["Load","Each segment stays in one piece","Segments in physical memory","The OS finds a space that is big enough for each segment. One segment stays in one continuous block, but different segments can be in different places."],
s3:["Map table","The segment map table records each segment","Segment map table","Each process has its own table, stored in RAM. The segment number is the index. The table gives each segment's size and start address. Data is segment 1: size 200 KB, starting at 600."],
s4:["Translate","Start address + offset","Segment number + offset","The program gives two values: segment 1, offset 150. The table gives the start address 600, so the physical address is 600 + 150 = 750. Your textbook writes \"segment number + offset\": the number is used to find the start address."],
s5:["Limit","The size stops a bad address","Offset must be less than size","Offset 250 is outside segment 1, because its size is only 200 KB. The address is refused and an exception interrupt is raised. This protects the memory of other segments."],
s6:["Share","The game fills some of the gaps","Variable-size blocks","The game's segments go into the spaces between the word processor's segments. Only 100 KB is left free now."],
},
ja:{
p0:["開始","プログラムはディスクで待っている","Program files · RAM","プログラムはファイルとしてディスクに保存されています。CPU が実行できるのは RAM にあるものだけなので、先に RAM へコピーする必要があります。最初の RAM には OS だけが入っています。"],
p1:["ページ","表計算を開くと、ページに分かれる","Logical memory · Pages","OS はプログラム専用の論理メモリを用意し、ページに分けます。どのページも同じ大きさで、ここでは 4 KiB です。意味ではなく大きさで切ります。"],
p2:["フレーム","RAM はフレームに分かれている","Physical memory · Frames","物理メモリはフレームに分かれています。フレームはページとまったく同じ大きさなので、どのページもどのフレームにも入ります。"],
p3:["読み込み","ページを空いているフレームに入れる","Loading pages into frames","ページを空きフレームにコピーします。隣り合っている必要はありません。プログラムからは、ページは順番どおりに見えています。"],
p4:["ページ表","ページ表が行き先を覚えている","Page table · P flag","ページ表はプログラムごとに1つあり、RAM に置かれます。ページ番号が索引で、ページ 3 はフレーム 9 にあります。P = 1 はそのページが RAM にあるという意味です。"],
p5:["変換","論理アドレス → 物理アドレス","MMU · Address translation","プログラムが指定するアドレスは1つです。MMU はそれを page 番号と offset に分け、ページ表でフレームを調べます。offset は変わりません。プログラムはフレーム番号を知らなくてもよいのです。"],
p6:["共有","複数のプログラムで RAM を共有する","Each process has its own table","ワープロとゲームを開きます。それぞれに専用の論理メモリとページ表があります。ページが空きフレームを埋めるので RAM は混ざって見えますが、表があるので順番は分かります。"],
v0:["RAM 満杯","ブラウザを開きたいが、RAM がいっぱい","No free frames","16 個のフレームはすべて使用中です。仮想メモリがなければ新しいプログラムは読み込めず、RAM より大きいプログラムも動きません。"],
v1:["スワップ","仮想メモリはディスクの場所を借りる","Virtual memory = RAM + swap space","HDD や SSD の一部をスワップファイルとして使います。これで RAM より多くのメモリを使えます。プログラムは、自分のどのページがディスクにあるかを知りません。"],
v2:["追い出す","ページをスワップファイルへ移す","Swap out · P flag · D flag","OS は一番長く使われていない G1 を選びます。G1 は RAM 上で変更されている（dirty、D = 1）ので、スワップファイルに書き込みます。表の P は 0 になり、フレーム 5 が空きます。"],
v3:["必要時に","ブラウザの最初のページを読み込む","Demand paging","B0 がフレーム 5 に入ります。B1 は必要になるまでディスクに置いたままです。必要なときだけページを読み込むことを demand paging といいます。"],
v4:["フォールト","ゲームがまた G1 を必要とする","Page fault (interrupt)","MMU が表を読むと P = 0 です。するとページフォールトが発生します。これはハードウェア割り込みで、プログラムのバグではありません。OS は G1 を RAM に戻します。"],
v5:["入れ替え","1ページ出して、1ページ入れる","Page replacement","空きフレームがないので、OS はページを入れ替えます。一番長く使われていない S5 をスワップファイルへ移し、G1 をフレーム 6 に入れます。表を更新すると、ゲームは続きを実行できます。"],
v6:["スラッシング","スワップが多すぎる","Disk thrashing · Thrash point","必要なメモリが RAM より多すぎると、ページの出し入れが止まらなくなります。ディスクはとても忙しくなり、CPU は本来の仕事がほとんどできません。thrash point に達すると、プログラムはほぼ止まります。RAM を増やすか、プログラムを減らすと改善します。"],
i0:["ページ","メモリを 30 MB のページに分ける","Memory 100 MB · Page size 30 MB","メモリは 100 MB、ページは 30 MB なので、ページは3つできます。最後の 10 MB は1ページに足りないので、ページとして使えません。"],
i1:["A","プログラムAはぴったり入る","No waste","プログラムAは 30 MB で、ページと同じ大きさです。ページ①はいっぱいになります。"],
i2:["B","プログラムBはページを丸ごと使う","Allocated in whole pages","プログラムBは 10 MB だけですが、メモリはページ単位で割り当てられます。ページ②を丸ごと使うので、ページ内の 20 MB は空いたままです。"],
i3:["C","プログラムCも同じ","Empty space inside the page","プログラムCは 20 MB なので、ページ③の中に 10 MB の空きが残ります。ページ内部の空きは合計 30 MB になりました。"],
i4:["D","プログラムDはその空きを使えない","Internal fragmentation","プログラムDには 20 MB が必要で、ページ②には 20 MB の空きがあります。しかしページ②はプログラムBのもので、空いているページもありません。ページ内部にできて他が使えない空きを内部断片化といいます。"],
e0:["満杯","大きさの違うプログラムでメモリが埋まる","Variable-size blocks","ここでは、セグメントのように、各プログラムに必要な分だけを連続した領域で割り当てます。ブロックの中に空きはなく、メモリはいっぱいです。"],
e1:["終了","プログラムBとDが終了する","Deallocation","プログラムBとDが終了し、OS がそのメモリを解放します。"],
e2:["空き領域","2つの空き領域ができる","Holes between blocks","空きは合計 20 MB になりました。ただし 10 MB ずつの2か所に分かれていて、間にプログラムCがあります。"],
e3:["F","プログラムFには 20 MB が必要","External fragmentation","プログラムFには連続した 20 MB が必要です。空きの合計は 20 MB ありますが、どの空きも 10 MB しかないので入りません。空きがブロックの間に分かれて使えないことを外部断片化といいます。ページングなら、どのページもどのフレームにも入るので起こりません。"],
s0:["開始","今度は同じ大きさに分けない","Program file · RAM","セグメンテーションでは、物理メモリをフレームに分けません。ここでは 0 から 1600 KB まで続くアドレスの範囲で、最後の部分に OS があります。"],
s1:["セグメント","プログラムを意味で分ける","Segments · Logical memory","ワープロをコード、データ、スタックに分けます。それぞれがセグメントです。必要なメモリが違うので、大きさも違います。プログラマからはこの分け方が見えます。"],
s2:["読み込み","各セグメントはひとかたまりのまま","Segments in physical memory","OS は各セグメントが入る大きさの場所を探します。1つのセグメントは連続した1ブロックのままですが、セグメント同士は離れていてもかまいません。"],
s3:["セグメント表","セグメント表が各セグメントを記録する","Segment map table","表はプロセスごとに1つあり、RAM に置かれます。セグメント番号が索引で、サイズと開始アドレスが分かります。データはセグメント 1 で、サイズ 200 KB、開始は 600 です。"],
s4:["変換","開始アドレス + offset","Segment number + offset","プログラムは2つの値を指定します：セグメント 1、offset 150。表の開始アドレスは 600 なので、物理アドレスは 600 + 150 = 750 です。教科書の「segment number + offset」では、番号を使って開始アドレスを調べます。"],
s5:["範囲","サイズを超えるアドレスは止める","Offset must be less than size","offset 250 はセグメント 1 の外です。サイズが 200 KB しかないからです。アドレスは拒否され、例外（exception）の割り込みが起こります。これで他のセグメントのメモリを守ります。"],
s6:["共有","ゲームがすき間の一部を埋める","Variable-size blocks","ゲームのセグメントがワープロのセグメントの間に入ります。残りの空きは 100 KB だけです。"],
},
zh:{
p0:["开始","程序在磁盘上等待","Program files · RAM","程序以文件形式保存在磁盘上。CPU 只能运行 RAM 中的内容，所以必须先把程序复制进来。一开始，RAM 中只有操作系统。"],
p1:["页","打开电子表格：它被分成页","Logical memory · Pages","操作系统为程序提供专用的逻辑内存，并把它分成页。每一页大小相同，这里是 4 KiB。程序是按大小切开的，而不是按含义。"],
p2:["页框","RAM 被分成页框","Physical memory · Frames","物理内存被分成页框。页框和页的大小完全相同，所以任何一页都能放进任何一个页框。"],
p3:["载入","页进入任何空闲页框","Loading pages into frames","页被复制到空闲页框中。它们不需要相邻。程序看到的页仍然是按顺序的。"],
p4:["页表","页表记住每一页的去向","Page table · P flag","每个程序都有自己的页表，存放在 RAM 中。页号是索引：第 3 页在页框 9。P = 1 表示这一页在 RAM 中。"],
p5:["转换","逻辑地址 → 物理地址","MMU · Address translation","程序只给出一个地址。MMU 把它分成页号和偏移，在页表中找到页框，偏移保持不变。程序不需要知道页框号。"],
p6:["共享","更多程序共享 RAM","Each process has its own table","打开文字处理和游戏。每个程序都有自己的逻辑内存和页表。它们的页填满空闲页框，RAM 看起来很混杂，但每张表都记录了页的顺序。"],
v0:["RAM 已满","要打开浏览器，但 RAM 已满","No free frames","16 个页框全部在使用。没有虚拟内存的话，新程序无法载入，比 RAM 大的程序也根本无法运行。"],
v1:["交换文件","虚拟内存在磁盘上增加空间","Virtual memory = RAM + swap space","HDD 或 SSD 的一部分被用作交换文件。现在程序可以使用比 RAM 更多的内存。程序并不知道自己的哪些页在磁盘上。"],
v2:["换出","一页移到交换文件","Swap out · P flag · D flag","操作系统选择最久没有使用的 G1。它在 RAM 中被修改过（dirty，D = 1），所以要写入交换文件。表中它的 P 变为 0，页框 5 空出来了。"],
v3:["按需","载入浏览器的第一页","Demand paging","B0 进入页框 5。B1 留在磁盘上，直到需要时才载入。只在需要时才载入页，叫作按需调页 (demand paging)。"],
v4:["缺页","游戏又需要 G1","Page fault (interrupt)","MMU 读表，发现 P = 0。于是产生缺页中断，这是硬件中断，不是程序的错误。操作系统现在必须把 G1 调回 RAM。"],
v5:["置换","换出一页，换入一页","Page replacement","没有空闲页框，所以操作系统要置换一页。S5 最久没有使用，它被移到交换文件，G1 进入页框 6。表更新后，游戏继续运行。"],
v6:["抖动","交换太频繁","Disk thrashing · Thrash point","如果程序需要的内存超过 RAM 的容量，页就会不停地换入换出。磁盘非常忙，CPU 几乎做不了实际工作。到达 thrash point 时，程序几乎停止。增加 RAM 或减少程序可以缓解。"],
i0:["页","把内存分成 30 MB 的页","Memory 100 MB · Page size 30 MB","内存有 100 MB，每页 30 MB，所以有三页。最后的 10 MB 不够一页，不能作为页使用。"],
i1:["程序 A","程序 A 正好放下","No waste","程序 A 是 30 MB，和一页一样大。第 1 页完全用满。"],
i2:["程序 B","程序 B 占用整整一页","Allocated in whole pages","程序 B 只有 10 MB，但内存是按整页分配的。它占用整个第 2 页，所以页内有 20 MB 是空的。"],
i3:["程序 C","程序 C 也一样","Empty space inside the page","程序 C 是 20 MB，所以第 3 页内有 10 MB 是空的。现在页内部总共有 30 MB 是空的。"],
i4:["程序 D","程序 D 不能使用这些空闲空间","Internal fragmentation","程序 D 需要 20 MB，第 2 页正好空着 20 MB。但第 2 页属于程序 B，也没有空闲的页。页内部出现、其他程序不能使用的空闲空间叫作内部碎片。"],
e0:["已满","大小不同的程序占满内存","Variable-size blocks","这里像分段一样，每个程序得到正好够用的连续空间。块的内部没有空闲，内存已满。"],
e1:["结束","程序 B 和 D 结束","Deallocation","程序 B 和 D 结束，操作系统释放它们的内存。"],
e2:["空洞","出现两个空洞","Holes between blocks","现在有 20 MB 空闲，但分成两个 10 MB 的空洞，中间隔着程序 C。"],
e3:["程序 F","程序 F 需要 20 MB","External fragmentation","程序 F 需要一个连续的 20 MB 空间。空闲总量是 20 MB，但每个空洞只有 10 MB，所以放不下。空闲空间被分隔在块与块之间，叫作外部碎片。分页可以避免这一点，因为任何一页都能放进任何页框。"],
s0:["开始","这次不分成相同大小的块","Program file · RAM","分段时，物理内存不分成页框。这里它是一段从 0 到 1600 KB 的连续地址，操作系统在最后。"],
s1:["段","程序按含义划分","Segments · Logical memory","文字处理程序被分成代码、数据和栈。每一部分是一个段。各部分需要的内存不同，所以大小也不同。程序员能看到这些部分。"],
s2:["载入","每个段保持完整","Segments in physical memory","操作系统为每个段找到足够大的空间。一个段是一个连续的块，但不同的段可以在不同的地方。"],
s3:["段映射表","段映射表记录每个段","Segment map table","每个进程都有自己的表，存放在 RAM 中。段号是索引。表中有每段的大小和起始地址。数据是段 1：大小 200 KB，从 600 开始。"],
s4:["转换","起始地址 + 偏移","Segment number + offset","程序给出两个值：段 1，偏移 150。表中的起始地址是 600，所以物理地址是 600 + 150 = 750。教科书写的是 “segment number + offset”：用段号来找到起始地址。"],
s5:["界限","大小可以阻止错误的地址","Offset must be less than size","偏移 250 在段 1 之外，因为它的大小只有 200 KB。这个地址被拒绝，并产生异常 (exception) 中断。这样可以保护其他段的内存。"],
s6:["共享","游戏填补了部分空隙","Variable-size blocks","游戏的段放进文字处理程序各段之间的空隙。现在只剩 100 KB 空闲。"],
},
th:{
p0:["เริ่ม","โปรแกรมรออยู่บนดิสก์","Program files · RAM","โปรแกรมเก็บเป็นไฟล์บนดิสก์ CPU รันได้เฉพาะสิ่งที่อยู่ใน RAM จึงต้องคัดลอกโปรแกรมเข้ามาก่อน ตอนเริ่มต้น RAM มีแค่ระบบปฏิบัติการ"],
p1:["หน้า","เปิดสเปรดชีต: มันถูกแบ่งเป็นหน้า","Logical memory · Pages","OS ให้หน่วยความจำเชิงตรรกะแก่โปรแกรม และแบ่งเป็นหน้า (page) ทุกหน้ามีขนาดเท่ากัน ในที่นี้คือ 4 KiB โปรแกรมถูกตัดตามขนาด ไม่ใช่ตามความหมาย"],
p2:["เฟรม","RAM ถูกแบ่งเป็นเฟรม","Physical memory · Frames","หน่วยความจำจริงถูกแบ่งเป็นเฟรม (frame) เฟรมมีขนาดเท่ากับหน้าพอดี หน้าใดจึงใส่เฟรมใดก็ได้"],
p3:["โหลด","หน้าเข้าไปอยู่ในเฟรมว่างใดก็ได้","Loading pages into frames","หน้าถูกคัดลอกไปยังเฟรมว่าง ไม่จำเป็นต้องอยู่ติดกัน โปรแกรมยังเห็นหน้าตามลำดับเหมือนเดิม"],
p4:["ตารางหน้า","ตารางหน้าจำว่าแต่ละหน้าไปอยู่ที่ไหน","Page table · P flag","แต่ละโปรแกรมมีตารางหน้าของตัวเอง เก็บอยู่ใน RAM เลขหน้าคือดัชนี: หน้า 3 อยู่ในเฟรม 9 P = 1 หมายความว่าหน้านั้นอยู่ใน RAM"],
p5:["แปลง","ที่อยู่เชิงตรรกะ → ที่อยู่จริง","MMU · Address translation","โปรแกรมให้ที่อยู่เพียงค่าเดียว MMU แยกเป็นเลขหน้ากับ offset หาเฟรมจากตารางหน้า และคง offset ไว้เท่าเดิม โปรแกรมไม่ต้องรู้เลขเฟรมเลย"],
p6:["ใช้ร่วมกัน","หลายโปรแกรมใช้ RAM ร่วมกัน","Each process has its own table","เปิดโปรแกรมประมวลคำและเกม แต่ละโปรแกรมมีหน่วยความจำเชิงตรรกะและตารางหน้าของตัวเอง หน้าต่างๆ เติมเฟรมว่าง RAM จึงดูปนกัน แต่ตารางยังรักษาลำดับหน้าไว้"],

/* ---------- Drawing ---------- */
function drawFiles(d){
  const list=isSeg()?["word","game","sheet","os"]:["browser","word","game","sheet","os"];
  const fname={word:"word.exe",game:"game.exe",sheet:"sheet.exe",browser:"browser.exe",os:"kernel"};
  $("zfiles").innerHTML=`<span class="ztag">${T.z.store}</span><span class="ztit">${T.filesT}</span><span class="zsub">${T.filesS}</span><div class="files">`+list.map(p=>{
    const open=d.open.includes(p),os=p==="os",canView=!os&&(open||d.want===p);
    const n=os?"":isSeg()?T.segs(SG[p].length):T.pages(PG[p].length);
    const st=os?T.always:open?T.inRam:T.onDisk;
    return `<button class="file c-${p}${open||os?" open":""}${view===p?" view":""}${d.want===p?" want":""}" data-id="file-${p}" data-p="${p}" ${canView?"":"disabled"}><span class="fn">${T.prog[p]}</span><span class="fx">${fname[p]}${n?" · "+n:""}</span><span class="fs">${st}</span></button>`}).join("")+`</div>`;
  $("zfiles").querySelectorAll(".file:not(:disabled)").forEach(b=>b.onclick=()=>{stopThrash();view=b.dataset.p;hover=null;draw(seq[s]);arrows(seq[s]);if(seq[s].thrash)startThrash()});
}
function drawLog(d){
  const others=d.open.filter(p=>p!==view);
  let body;
  if(!view)body=`<div class="sheet"><div class="lemp">${T.logE}</div></div>`;
  else if(isSeg()){
    body=`<div class="sheet c-${view}">`+SG[view].map(x=>{const loaded=d.sg[x[0]]!==undefined;
      return `<div class="cell tall lcell c-${view}${loaded?"":" out"}" data-id="L-${x[0]}" data-k="${x[0]}" style="--h:${Math.max(x[2]*SC,30)}px"><span>${x[0][1]} · ${T.seg[x[1]]}</span><span>${x[2]} KB</span></div>`}).join("")+`</div>`;
  }else{
    body=`<div class="sheet c-${view}">`+PG[view].map(k=>{const inR=d.fr[k]!==undefined,pt=(d.part||[]).includes(k);
      return `<div class="cell lcell c-${view}${inR?"":" out"}${pt?" part":""}" data-id="L-${k}" data-k="${k}"><span>${k}</span></div>`}).join("")+`</div>`;
  }
  $("zlog").innerHTML=`<span class="ztag ghost">${T.z.none}</span><span class="ztit">${T.logT}</span><span class="zsub">${T.logS}</span><div class="logwrap">`+others.map(p=>`<i class="edge c-${p}" aria-hidden="true"></i>`).join("")+body+`</div>`;
  $("zlog").querySelectorAll(".lcell").forEach(c=>{
    c.onpointerenter=()=>{hover=c.dataset.k;arrows(d)};c.onpointerleave=()=>{hover=null;arrows(d)};c.onclick=()=>{hover=c.dataset.k;arrows(d)}});
}
function tableHTML(d){
  const hot=d.hot.includes("tablebox")?" hot":"";

      return `<tr class="c-${view} ${cls}" data-id="R-${x[0]}"><td class="k">${i}</td><td>${x[2]}</td><td>${b===undefined?T.none:b}</td></tr>`}).join(""):"";

  }

  return `<div class="tablebox${hot}" id="tablebox"><span class="ztit">${T.ptT}</span><span class="zsub">${name}</span>${view?`<table class="ptb"><thead><tr>${T.ptH.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`:empty}</div>`;

function physHTML(d){
  const hot=d.hot.includes("physbox")?" hot":"";
  if(isSeg()){
    const blocks=[...Object.entries(d.sg).map(([k,b])=>({k,b,sz:SIZE[k]})),{k:"OS",b:OSB,sz:RAMKB-OSB}].sort((a,b)=>a.b-b.b);
    let out="",pos=0;
    const hole=(a,z)=>`<div class="sb" style="top:${a*SC}px;height:${(z-a)*SC}px"><div class="hole">${z-a}</div></div><span class="tick" style="top:${a*SC}px">${a}</span>`;
    blocks.forEach(x=>{
      if(x.b>pos)out+=hole(pos,x.b);

function buildExam(){
  const u=EXUI[lang];
  const both=o=>`${o.en}${lang==="en"?"":`<span class="tr">${o[lang]}</span>`}`;
  $("exH").textContent=u.h;$("exL").textContent=u.l;
  $("exam").innerHTML=EX.map((x,i)=>{
    const total=x.parts.reduce((a,p)=>a+p.m,0);
    const table=x.table?`<div style="overflow-x:auto"><table class="extb"><thead><tr>${x.table.h.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${x.table.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:"";
    const parts=x.parts.map(p=>`<div class="expart"><i>${p.l}</i><span>${both(p.q)}</span><em>[${p.m}]</em></div>`).join("");
    const ans=x.parts.map(p=>`<div><h4>${p.l} · ${u.mk(p.m)}</h4>${p.any?`<p class="exnote">${u.any}</p>`:""}<ul>${p.a.map(a=>`<li><span>${both(a)}</span><em>[1]</em></li>`).join("")}</ul></div>`).join("");
    return `<article class="exq"><div class="exhead"><b>${u.q} ${i+1}</b><span>${u.mk(total)}</span></div>${x.stem?`<p>${both(x.stem)}</p>`:""}${table}${parts}
      <div class="exans"><h3>${u.ms}</h3>${ans}</div></article>`}).join("");
}
/* ---------- Static sections ---------- */
function buildStatic(){
  const set=(id,v)=>{$(id).innerHTML=v};
  set("tEyebrow",T.eyebrow);set("tH1",T.h1);set("tLead",T.lead);set("simH",T.simH);
  set("prev",T.btn.prev);set("next",T.btn.next);set("reset",T.btn.reset);$("play").textContent=T.btn.play;set("spdL",T.btn.spd);
  const keep=$("spd").value||"5500";
  $("spd").innerHTML=[8000,5500,3500].map((v,i)=>`<option value="${v}">${T.btn.sp[i]}</option>`).join("");$("spd").value=keep;
  set("hint",T.hint);
  const sw=["solid","dash","hatch","red","ring"];
  set("legend",T.lg.map((t,i)=>`<span><i class="sw ${sw[i]}"></i>${t}</span>`).join(""));
  set("whereH",T.whereH);set("whereL",T.whereL);
  set("whereHd","<tr>"+T.whereHd.map(h=>`<th>${h}</th>`).join("")+"</tr>");
  set("whereB",T.where.map(r=>`<tr><th scope="row">${r[0]}</th><td><span class="ztagc ${r[1]}">${T.tag[r[1]]}</span></td><td>${r[2]}</td></tr>`).join(""));
  set("cmpH",T.cmpH);set("cmpL",T.cmpL);
  const fbtn=k=>`<button class="btn figbtn" data-go="${k}">${T.fg.go}</button>`;
  set("figs",`<div class="fig"><h3>${T.figP}</h3>${memInt(4,false)}<p class="small">${T.figPn}</p>${fbtn("int")}</div>
   <div class="fig"><h3>${T.figS}</h3>${memExt(3,false)}<p class="small">${T.figSn}</p>${fbtn("ext")}</div>`);
  $("figs").querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{setSc(x.dataset.go);$("sim").scrollIntoView({behavior:"smooth",block:"start"})});
  set("cmpHd","<tr>"+T.cmpHd.map(h=>`<th>${h}</th>`).join("")+"</tr>");
  set("cmpB",T.cmp.map(r=>`<tr><th scope="row">${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td></tr>`).join(""));
  set("model",`<span class="small">${T.modelL}</span><span class="mt">${T.model}</span>`);
  set("repH",T.repH);set("repL",T.repL);
  set("repHd","<tr>"+T.repHd.map(h=>`<th>${h}</th>`).join("")+"</tr>");
  set("repB",T.rep.map(r=>`<tr><th scope="row">${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td></tr>`).join(""));
  set("anH",T.anH);set("ana",T.an.map(a=>`<div class="an"><span class="n">${a[0]}</span><span class="real">${a[1]}</span><span class="cs">${a[2]}</span></div>`).join(""));
  set("pitH",T.pitH);set("pit",T.pit.map(p=>`<div class="pitem"><div><span class="k x">${T.bad}</span><p>${p[0]}</p></div><div><span class="k o">${T.good}</span><p>${p[1]}</p></div></div>`).join(""));
  buildExam();
  set("qzH",T.qzH);buildQuiz();
}
function buildQuiz(){
  score=0;$("quiz").innerHTML="";$("score").textContent=`0 / ${T.qs.length}`;
  T.qs.forEach((x,i)=>{
    const box=document.createElement("div");box.className="q";
    box.innerHTML=`<h3>Q${i+1}. ${x.q}</h3><div class="opts">${x.o.map((o,j)=>`<button class="opt" id="q${i}o${j}">${"ABCD"[j]}. ${o}</button>`).join("")}</div><p class="fb" id="fb${i}"></p>`;
    $("quiz").appendChild(box);let done=false;
    box.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>{if(done)return;done=true;
      box.querySelectorAll(".opt")[x.a].classList.add("right");if(j!==x.a)b.classList.add("wrong");else score++;
      $("fb"+i).textContent=(j===x.a?T.right:T.wrong("ABCD"[x.a]))+x.ex;$("score").textContent=`${score} / ${T.qs.length}`});
  });
}
function setLang(l){
  lang=l;T=TX[l];document.body.className="v-"+l;
  document.documentElement.lang={en:"en",ja:"ja",zh:"zh-Hans",th:"th"}[l];
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  try{localStorage.setItem("memlab-lang",l)}catch(e){}
  stop();buildStatic();buildScen();buildTrack();render(false);
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$("next").onclick=()=>go(s+1);$("prev").onclick=()=>go(s-1);$("reset").onclick=()=>go(0,true);
$("play").onclick=()=>{if(timer){stop();return}if(s===seq.length-1){s=0;render(false)}$("play").textContent=T.btn.pause;
  timer=setInterval(()=>{if(s>=seq.length-1){stop();return}s++;render(true)},+$("spd").value)};
$("spd").onchange=()=>{if(timer){stop();$("play").click()}};
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(e.key==="ArrowRight")go(s+1);if(e.key==="ArrowLeft")go(s-1)});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!seq[s].frag)arrows(seq[s])},120)});
let start="ja";try{const v=localStorage.getItem("memlab-lang");if(v&&TX[v])start=v}catch(e){}
setLang(start);
